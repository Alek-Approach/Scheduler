<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approach ISC — Teacher Scheduling</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --surface-2: #F8F9FA;
  --ink: #17222E;
  --ink-2: #4B5867;
  --ink-3: #7A8592;
  --line: #D8DEE4;
  --line-2: #E8ECEF;
  --navy: #1D3A5E;
  --navy-2: #2C527F;
  --navy-soft: #E7EEF6;
  --gold: #A9771C;
  --gold-soft: #FBF2DE;
  --ok: #2B6E4A;
  --ok-soft: #E3F1E8;
  --bad: #A3302A;
  --bad-soft: #FAE8E6;
  --radius: 6px;
  --radius-lg: 10px;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--bg);
  font-variant-numeric: tabular-nums;
}
a { color: var(--navy-2); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 16px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0 0 8px; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }
.hidden { display: none !important; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side { background: var(--navy); color: #DCE6F2; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { padding: 18px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.1); }
.brand strong { display: block; color: #fff; font-size: 15px; font-weight: 600; }
.brand span { font-size: 12px; color: #A9BDD3; }
.nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; }
.nav button {
  all: unset; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; cursor: pointer;
  padding: 7px 10px; border-radius: var(--radius); color: #DCE6F2; font-size: 13.5px;
}
.nav button:hover { background: rgba(255,255,255,.07); }
.nav button:focus-visible { outline: 2px solid #F2C46D; outline-offset: -2px; }
.nav button[aria-current="page"] { background: #fff; color: var(--navy); font-weight: 600; }
.nav .step { font-size: 11.5px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.35); }
.nav button[aria-current="page"] .step { border-color: var(--navy); }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; }
.nav .dot.warn { background: #F2C46D; }
.nav .dot.ok { background: #7CC59A; }
.nav .group { margin: 12px 10px 4px; font-size: 12px; color: #93AAC4; }
.side-foot { margin-top: auto; padding: 12px 18px 16px; font-size: 12px; color: #A9BDD3; border-top: 1px solid rgba(255,255,255,.1); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--surface);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap;
}
.topbar .quarter { font-weight: 600; }
.topbar .spacer { flex: 1; }
.content { padding: 22px 24px 60px; max-width: 1320px; width: 100%; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head .lead { color: var(--ink-2); max-width: 70ch; margin-top: 4px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); margin-bottom: 16px; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.panel-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.panel-body { padding: 14px 16px; }
.panel-body.flush { padding: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

/* ---------- metrics strip ---------- */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); margin-bottom: 16px; overflow: hidden; }
.metric { padding: 12px 14px; border-right: 1px solid var(--line-2); }
.metric:last-child { border-right: 0; }
.metric .v { font-size: 20px; font-weight: 600; }
.metric .k { font-size: 12.5px; color: var(--ink-2); }
.metric.bad .v { color: var(--bad); }
.metric.ok .v { color: var(--ok); }
.metric.warn .v { color: var(--gold); }

/* ---------- buttons & inputs ---------- */
.btn { white-space: nowrap;
  font: inherit; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn:hover { border-color: var(--ink-3); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible, .cellbtn:focus-visible { outline: 2px solid var(--navy-2); outline-offset: 1px; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.primary:hover { background: var(--navy-2); }
.btn.danger { color: var(--bad); border-color: #E3B7B2; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--navy-2); }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
input[type=text], input[type=email], input[type=number], input[type=date], input[type=search], select, textarea {
  font: inherit; font-size: 13.5px; color: var(--ink); padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; min-width: 0;
}
textarea { min-height: 60px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar input[type=search] { width: 220px; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
tr:hover td { background: #FAFBFC; }
td.num, th.num { text-align: right; }
td .sub { display: block; color: var(--ink-3); font-size: 12px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); border-color: #BFDCCB; color: var(--ok); }
.badge.bad { background: var(--bad-soft); border-color: #EBC3BE; color: var(--bad); }
.badge.warn { background: var(--gold-soft); border-color: #EBD3A3; color: #7E5810; }
.badge.info { background: var(--navy-soft); border-color: #C9D7E8; color: var(--navy); }
.score { font-weight: 600; }
.score.low { color: var(--bad); }
.score.ok { color: var(--ok); }

/* ---------- notices ---------- */
.notice { border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; border: 1px solid; font-size: 13.5px; }
.notice.warn { background: var(--gold-soft); border-color: #EBD3A3; }
.notice.bad { background: var(--bad-soft); border-color: #EBC3BE; }
.notice.ok { background: var(--ok-soft); border-color: #BFDCCB; }
.notice.info { background: var(--navy-soft); border-color: #C9D7E8; }
.notice ul { margin: 6px 0 0; padding-left: 18px; }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line-2); align-items: start; }
.checklist li:last-child { border-bottom: 0; }
.checklist .mark { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: #fff; margin-top: 1px; }
.checklist .mark.ok { background: var(--ok); }
.checklist .mark.warn { background: var(--gold); }
.checklist .mark.bad { background: var(--bad); }

/* ---------- the block board (signature) ---------- */
.board { display: grid; grid-template-columns: 92px repeat(6, minmax(120px, 1fr)); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: var(--line); gap: 1px; }
.board.compact { grid-template-columns: 88px repeat(6, minmax(64px, 1fr)); }
.board > div { background: var(--surface); padding: 8px; min-height: 44px; }
.board .bh { background: var(--surface-2); font-weight: 600; font-size: 12.5px; color: var(--ink-2); min-height: 0; }
.board .rh { background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); }
.board .rh b { display: block; color: var(--ink); font-size: 13px; }
.board .closed { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--line-2) 6px 8px); color: var(--ink-3); font-size: 12px; display: grid; place-items: center; }
.cellbtn { all: unset; display: block; width: 100%; height: 100%; min-height: 34px; border-radius: 4px; text-align: center; font-size: 12.5px; cursor: pointer; padding: 6px 2px; box-sizing: border-box; }
.cellbtn.unavailable { background: var(--surface-2); color: var(--ink-3); border: 1px dashed var(--line); }
.cellbtn.available { background: var(--navy-soft); color: var(--navy); border: 1px solid #C9D7E8; }
.cellbtn.preferred { background: var(--navy); color: #fff; border: 1px solid var(--navy); font-weight: 600; }
.chip {
  display: block; width: 100%; text-align: left; font: inherit; font-size: 12px; cursor: pointer; margin-bottom: 4px;
  padding: 5px 7px; border-radius: 4px; border: 1px solid var(--line); border-left: 3px solid var(--navy-2); background: #fff; color: var(--ink);
}
.chip:hover { border-color: var(--ink-3); border-left-color: var(--navy-2); }
.chip b { font-weight: 600; display: block; }
.chip .t { color: var(--ink-2); }
.chip.unassigned { border-left-color: var(--bad); background: var(--bad-soft); }
.chip.approval { border-left-color: var(--gold); background: var(--gold-soft); }
.chip.rcl { border-left-color: var(--ink-3); background: var(--surface-2); border-style: dashed; border-left-style: solid; }
.chip.locked .lock { float: right; color: var(--navy); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin: 8px 0 0; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; font-size: 13.5px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }
.tabs button:focus-visible { outline: 2px solid var(--navy-2); }

/* ---------- modal & toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(23, 34, 46, .45); display: grid; place-items: start center; padding: 40px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: var(--radius-lg); width: min(860px, 100%); box-shadow: 0 18px 50px rgba(15, 30, 50, .25); }
.modal.narrow { width: min(520px, 100%); }
.modal-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line-2); gap: 10px; }
.modal-head .x { margin-left: auto; }
.modal-body { padding: 16px 18px; max-height: calc(100vh - 220px); overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line-2); }
.toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: var(--radius); z-index: 60; max-width: 420px; font-size: 13.5px; }
.toast.bad { background: var(--bad); }
.progress { height: 6px; background: var(--line-2); border-radius: 3px; overflow: hidden; margin: 8px 0; }
.progress > i { display: block; height: 100%; background: var(--navy-2); transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }

dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13.5px; }
dl.kv dt { color: var(--ink-2); }
dl.kv dd { margin: 0; }
details summary { cursor: pointer; color: var(--navy-2); }
pre.email { white-space: pre-wrap; font: inherit; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 10px; margin: 6px 0; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav .group, .side-foot { display: none; }
  .content { padding: 16px 12px 40px; }
  .board { grid-template-columns: 70px repeat(6, minmax(110px, 1fr)); overflow-x: auto; }
}

/* ---------- print ---------- */
#print-root { display: none; }
@media print {
  body { background: #fff; }
  .shell, .overlay, .toast { display: none !important; }
  #print-root { display: block; }
  .print-page { page-break-after: always; padding: 0; }
  .print-page:last-child { page-break-after: auto; }
  .print-page h2 { margin-bottom: 4px; }
  .print-page table { font-size: 11.5px; }
  .print-page th { position: static; }
}

</style>
</head>
