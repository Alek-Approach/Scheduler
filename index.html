<!-- Exact optimization library: GLPK (glpk.js 4.0.2, GPL-3.0) from jsDelivr. If it cannot load,
     the app uses its built-in fallback search and labels results "not proven optimal". -->
<script type="module">
  window.__glpkStatus = 'loading';
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), ms))]);
  try {
    const mod = await withTimeout(import('https://cdn.jsdelivr.net/npm/glpk.js@4.0.2/dist/index.js'), 20000);
    const glpk = await withTimeout(mod.default(), 20000);
    const test = await withTimeout(Promise.resolve(glpk.solve({ name: 'selftest', objective: { direction: glpk.GLP_MAX, name: 'o', vars: [{ name: 'x', coef: 1 }] },
      subjectTo: [{ name: 'c', vars: [{ name: 'x', coef: 1 }], bnds: { type: glpk.GLP_UP, ub: 1, lb: 0 } }], binaries: ['x'] }, { msglev: glpk.GLP_MSG_OFF })), 20000);
    if (!test || !test.result || Math.round(test.result.z) !== 1) throw new Error('self-test failed');
    window.__glpk = glpk; window.__glpkStatus = 'ready';
  } catch (e) {
    window.__glpk = null; window.__glpkStatus = 'unavailable'; window.__glpkError = String(e && e.message || e);
    console.warn('Exact solver unavailable; using fallback search.', e);
  }
  window.dispatchEvent(new Event('glpk-status'));
</script>

<!-- Scheduling engine -->
<script>
/*!
 * Approach ISC Teacher Scheduling Engine — Stage 3
 * Assigns teachers to fixed, standard 4-hour course sections.
 * RCL classes are manual: read as fixed, conflict-checked time; never assigned or changed here.
 *
 * Works in the browser (global `ApproachScheduler`) and in Node (`require`).
 * Exact mode needs a GLPK.js instance passed in; without one the engine falls back to a
 * documented heuristic and labels its results "not proven optimal".
 *
 * All sample data used with this engine is fictional.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.ApproachScheduler = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * 1. Constants
   * ------------------------------------------------------------------ */
  const DAYS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  const BLOCKS = { AM: { start: 540, end: 780 }, PM: { start: 840, end: 1080 }, EV: { start: 1080, end: 1320 } };
  const BLOCK_ORDER = ['AM', 'PM', 'EV'];
  const ADJACENT_BLOCKS = [['AM', 'PM'], ['PM', 'EV']];
  const VALID_SLOTS = DAYS.flatMap(d => (d === 'SAT' ? ['AM', 'PM'] : ['AM', 'PM', 'EV']).map(b => d + '_' + b));
  const CAMPUSES = ['Allston', 'Marlborough'];
  const PROGRAMS = ['ESL', 'Business', 'Advanced Academic'];
  const PROGRAM_KEY = { 'ESL': 'esl', 'Business': 'business', 'Advanced Academic': 'advanced_academic' };
  const LEVELS = ['Basic', 'Independent', 'Proficient'];

  // Score comparison tolerance: a score that displays as the target (e.g. 79.9998% shown as 80.0%) meets it.
  // Needed because the provisional weights are rounded percentages (46.15 / 30.77 / 23.08).
  const SCORE_TOL = 5e-5;

  const DEFAULT_SETTINGS = {
    weights: { time: 0.4615, workload: 0.3077, course: 0.2308 },   // provisional, configurable (final corrections §1); campus is compliance, not scored
    credits: { preferred: 1.0, acceptable: 0.75, lessPreferred: 0.5, confirm: 0.5 }, // provisional (Q8)
    target: 0.80,
    travelRule: true,              // item 4, configurable
    balancedTolerance: 2,          // Q14 (initial value from your example; R5)
    designatedApprover: null,      // Q16: email of the one person who may finalize (recorded, not securely enforced in v1)
    timeLimitSec: 15,              // per solver stage
    candidateTimeBudgetSec: 90,    // per candidate; when used up, the best solution found so far is kept and labelled
    seed: 20261118,                // heuristic only
    heuristicMaxPasses: 40,
    alternativeMinChanges: 3,      // A2 must differ in at least this many assignments
    strategies: ['A', 'B', 'C', 'A2']
  };

  const STRATEGY_LABELS = {
    A: 'A — Coverage first',
    B: 'B — Teachers protected',
    C: 'C — Balanced',
    A2: 'A2 — Alternative to A'
  };

  /* ------------------------------------------------------------------ *
   * 2. Small helpers
   * ------------------------------------------------------------------ */
  const toMin = hhmm => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim());
    if (!m) return NaN;
    const h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return NaN;
    return h * 60 + mi;
  };
  const fmtTime = min => {
    const h = Math.floor(min / 60), m = min % 60;
    const h12 = ((h + 11) % 12) + 1;
    return h12 + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? ' AM' : ' PM');
  };
  const DAY_NAMES = { MON: 'Monday', TUE: 'Tuesday', WED: 'Wednesday', THU: 'Thursday', FRI: 'Friday', SAT: 'Saturday' };
  const normDay = d => {
    const k = String(d || '').trim().slice(0, 3).toUpperCase();
    return DAYS.includes(k) ? k : null;
  };
  const round4 = v => (v == null ? null : Math.round(v * 10000) / 10000);
  const pct = v => (v == null ? 'n/a' : (Math.round(v * 1000) / 10).toFixed(1) + '%');
  const deepMerge = (a, b) => {
    const out = JSON.parse(JSON.stringify(a));
    for (const k of Object.keys(b || {})) {
      if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && out[k] && typeof out[k] === 'object') out[k] = deepMerge(out[k], b[k]);
      else out[k] = b[k];
    }
    return out;
  };
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  /* ------------------------------------------------------------------ *
   * 3. CSV parsing + course demand validation (section 4 and 9 of the spec)
   * ------------------------------------------------------------------ */
  function parseCSV(text) {
    const rows = []; let row = []; let field = ''; let q = false;
    const s = String(text || '').replace(/^\uFEFF/, '');
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) {
        if (c === '"') { if (s[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && s[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => String(v).trim() !== ''));
  }

  const COURSE_COLUMNS = ['section_id', 'course_id', 'course_name', 'program', 'levels', 'course_type',
    'delivery_mode', 'campus', 'day', 'start_time', 'end_time', 'notes'];
  const COURSE_REQUIRED_COLUMNS = COURSE_COLUMNS.filter(c => c !== 'notes');

  /**
   * Parse and validate a course-demand CSV. Never drops a row silently:
   * every row is returned either in `sections` (valid, maybe with warnings) or in `rejected` with its errors.
   */
  function parseCourseCSV(text, { existingSectionIds = [] } = {}) {
    const report = { sections: [], rejected: [], fileErrors: [], warnings: [] };
    const rows = parseCSV(text);
    if (!rows.length) { report.fileErrors.push('The file is empty.'); return report; }
    const header = rows[0].map(h => h.trim().toLowerCase());
    const missing = COURSE_REQUIRED_COLUMNS.filter(c => !header.includes(c));
    if (missing.length) { report.fileErrors.push('Missing required column(s): ' + missing.join(', ')); return report; }
    const idx = Object.fromEntries(header.map((h, i) => [h, i]));
    const seen = new Map(existingSectionIds.map(id => [id, 'existing']));
    const courseInfo = new Map();

    rows.slice(1).forEach((r, n) => {
      const line = n + 2;
      const get = c => (idx[c] == null ? '' : String(r[idx[c]] == null ? '' : r[idx[c]]).trim());
      const errors = [], warnings = [];
      const raw = Object.fromEntries(COURSE_COLUMNS.map(c => [c, get(c)]));
      for (const c of ['section_id', 'course_id', 'course_name', 'program', 'course_type', 'delivery_mode', 'day', 'start_time', 'end_time'])
        if (!raw[c]) errors.push(`Missing value: ${c}`);

      if (raw.section_id) {
        if (seen.has(raw.section_id)) errors.push(seen.get(raw.section_id) === 'existing'
          ? `Duplicate section_id ${raw.section_id} (already in this quarter)`
          : `Duplicate section_id ${raw.section_id} (also on line ${seen.get(raw.section_id)})`);
        else seen.set(raw.section_id, line);
      }
      if (raw.program && !PROGRAMS.includes(raw.program)) errors.push(`Unknown program "${raw.program}"`);
      const type = raw.course_type;
      if (type && !['Standard', 'RCL'].includes(type)) errors.push(`Unknown course_type "${type}"`);
      const mode = raw.delivery_mode;
      if (mode && !['In-person', 'Online'].includes(mode)) errors.push(`Unknown delivery_mode "${mode}"`);
      if (mode === 'Online' && raw.campus) errors.push('Campus must be blank for an Online section');
      if (mode === 'In-person') {
        if (!raw.campus) errors.push('Campus is required for an In-person section');
        else if (!CAMPUSES.includes(raw.campus)) errors.push(`Unsupported campus "${raw.campus}"`);
      }
      const levels = raw.levels ? raw.levels.split('|').map(s => s.trim()).filter(Boolean) : [];
      if (raw.program === 'ESL') {
        if (!levels.length) errors.push('ESL section needs at least one level');
        levels.forEach(l => { if (!LEVELS.includes(l)) errors.push(`Invalid level "${l}"`); });
        if (new Set(levels).size !== levels.length) errors.push('A level is listed twice');
      } else if (raw.program && levels.length) errors.push(`Levels must be blank for ${raw.program}`);

      const day = normDay(raw.day);
      if (raw.day && !day) errors.push(`Invalid day "${raw.day}"`);
      const start = toMin(raw.start_time), end = toMin(raw.end_time);
      if (raw.start_time && isNaN(start)) errors.push(`Invalid start_time "${raw.start_time}" (use HH:MM)`);
      if (raw.end_time && isNaN(end)) errors.push(`Invalid end_time "${raw.end_time}" (use HH:MM)`);
      let block = null;
      if (!isNaN(start) && !isNaN(end) && day) {
        if (end <= start) errors.push('end_time must be after start_time');
        const within = BLOCK_ORDER.find(b => start >= BLOCKS[b].start && end <= BLOCKS[b].end);
        if (day === 'SAT' && (start >= BLOCKS.EV.start || end > BLOCKS.PM.end)) errors.push('No classes on Saturday evening');
        else if (!within) errors.push('Outside operating hours or crosses a block boundary (blocks: 9–13, 14–18, 18–22)');
        else block = within;
        if (type === 'Standard' && block && !(start === BLOCKS[block].start && end === BLOCKS[block].end))
          errors.push('A Standard class must fill exactly one block (9:00–13:00, 14:00–18:00 or 18:00–22:00)');
        if (type === 'RCL' && end - start !== 120) errors.push('An RCL class must last exactly 2 hours');
      }
      if (!errors.length && raw.course_id) {
        const sig = [raw.course_name, raw.program, levels.join('|')].join(' / ');
        if (courseInfo.has(raw.course_id) && courseInfo.get(raw.course_id) !== sig)
          warnings.push(`course_id ${raw.course_id} has a different name/program/levels than an earlier row`);
        else courseInfo.set(raw.course_id, sig);
      }
      if (errors.length) report.rejected.push({ line, section_id: raw.section_id || null, raw, errors });
      else {
        const sec = {
          id: raw.section_id, course_id: raw.course_id, name: raw.course_name, program: raw.program,
          levels, type, mode, campus: mode === 'Online' ? null : raw.campus, day, start, end, block,
          slot: day + '_' + block, notes: raw.notes, line
        };
        report.sections.push(sec);
        if (warnings.length) report.warnings.push({ line, section_id: sec.id, warnings });
      }
    });
    return report;
  }

  /* ------------------------------------------------------------------ *
   * 4. Context: normalize teachers, preferences, sections
   * ------------------------------------------------------------------ */
  function buildContext(project) {
    const settings = deepMerge(DEFAULT_SETTINGS, project.settings || {});
    const issues = { blocking: [], warnings: [], notScheduled: [] };
    const quarter = project.quarter_id || null;

    const allSections = (project.sections || []).slice().sort((a, b) => a.id.localeCompare(b.id));
    const S = allSections.filter(s => s.type === 'Standard');
    const R = allSections.filter(s => s.type === 'RCL');
    const secIndex = new Map(S.map((s, j) => [s.id, j]));
    const rclById = new Map(R.map(s => [s.id, s]));

    const prefsById = new Map((project.preferences || []).map(p => [p.teacher_id, p]));
    const configById = new Map((project.teacherConfig || []).map(c => [c.teacher_id, c]));
    const qualsByT = new Map();
    (project.qualifications || []).forEach(q => {
      if (q.status && q.status !== 'verified') return;
      if (!qualsByT.has(q.teacher_id)) qualsByT.set(q.teacher_id, []);
      qualsByT.get(q.teacher_id).push(q);
    });

    // Manual RCL assignments
    const rclByT = new Map();
    (project.rclAssignments || []).forEach(ra => {
      const sec = rclById.get(ra.section_id);
      if (!sec) { issues.warnings.push(`RCL assignment for unknown section ${ra.section_id} ignored`); return; }
      if (!rclByT.has(ra.teacher_id)) rclByT.set(ra.teacher_id, []);
      rclByT.get(ra.teacher_id).push(sec);
    });

    const T = [];
    (project.teachers || []).slice().sort((a, b) => a.teacher_id.localeCompare(b.teacher_id)).forEach(t => {
      if (t.status && t.status !== 'active') return;
      const p = prefsById.get(t.teacher_id);
      if (!p) { issues.notScheduled.push({ teacher_id: t.teacher_id, reason: 'No preferences this quarter (survey missing; admin may enter them, Q12)' }); return; }
      const avail = {};
      VALID_SLOTS.forEach(sl => { avail[sl] = (p.availability && p.availability[sl]) || 'unavailable'; });
      const mappings = new Map((p.courseMappings || []).filter(m => m.course_id && m.status !== 'unmatched').map(m => [m.course_id, m.preference]));
      const programPrefs = new Set(p.programPrefs || []);
      const levelPrefs = new Set(p.levelPrefs || []);
      const rcls = rclByT.get(t.teacher_id) || [];
      const min = +p.min_classes, d = +p.desired_classes, max = +p.max_classes;
      if (!(min <= d && d <= max)) {
        issues.blocking.push(`${t.teacher_id}: minimum ≤ desired ≤ maximum is not satisfied (${min}/${d}/${max}); fix before scheduling`);
      }
      // RCL workload rule is decided per teacher by an administrator (final corrections §2)
      let effMax = max;
      const cfg = configById.get(t.teacher_id) || {};
      const rclCounts = rcls.length ? (cfg.rcl_counts_toward_max === true ? true : cfg.rcl_counts_toward_max === false ? false : null) : undefined;
      if (rcls.length) {
        if (rclCounts === null) issues.blocking.push(`${t.teacher_id} has ${rcls.length} manual RCL class(es) but "RCL counts toward maximum" is not set for this teacher; an administrator must choose Option A (counts) or Option B (does not count) before scheduling`);
        else if (rclCounts) effMax = Math.floor(max - 0.5 * rcls.length + 1e-9);
      }
      T.push({
        id: t.teacher_id, name: t.full_name, email: t.school_email, pref: p,
        quals: qualsByT.get(t.teacher_id) || [], avail,
        hasPreferredSlot: VALID_SLOTS.some(sl => avail[sl] === 'preferred'),
        programPrefs, levelPrefs, mixed: p.mixed_level || 'no_preference', mappings,
        hasNamedPreferred: [...mappings.values()].includes('preferred'),
        courseApplicable: programPrefs.size > 0 || levelPrefs.size > 0 || mappings.size > 0,
        min, d, max, effMax: Math.max(0, effMax), rcls, rclCounts
      });
    });
    const tIndex = new Map(T.map((t, i) => [t.id, i]));

    // RCL conflicts among manual RCLs (error) and availability (warning)
    T.forEach(t => {
      for (let a = 0; a < t.rcls.length; a++) for (let b = a + 1; b < t.rcls.length; b++) {
        const x = t.rcls[a], y = t.rcls[b];
        if (x.day === y.day && x.start < y.end && y.start < x.end) issues.blocking.push(`${t.id}: manual RCLs ${x.id} and ${y.id} overlap`);
      }
      t.rcls.forEach(r => { if (t.avail[r.slot] === 'unavailable') issues.warnings.push(`${t.id}: manual RCL ${r.id} is in a block marked Unavailable (admin decision)`); });
    });

    const locked = (project.locked || []).filter(l => secIndex.has(l.section_id));
    const lockedBySection = new Map(locked.map(l => [l.section_id, l.teacher_id]));
    locked.forEach(l => { if (!tIndex.has(l.teacher_id)) issues.blocking.push(`Locked assignment ${l.section_id} → ${l.teacher_id}: teacher is not schedulable this quarter`); });
    const excluded = new Set((project.excludedPairs || []).map(e => e.teacher_id + '|' + e.section_id));

    const ctx = { settings, quarter, S, R, T, secIndex, tIndex, lockedBySection, excluded, issues, project };
    ctx.omega = T.map(t => omegaFor(ctx, t));
    computePairs(ctx);
    return ctx;
  }

  function omegaFor(ctx, t) {
    const w = ctx.settings.weights;
    return (t.hasPreferredSlot ? w.time : 0) + (t.courseApplicable ? w.course : 0) + w.workload;
  }

  /* ------------------------------------------------------------------ *
   * 5. Eligibility (hard rules H1, H4, H5-vs-RCL, H6) and credits
   * ------------------------------------------------------------------ */
  function qualification(t, s, quarter) {
    const prog = PROGRAM_KEY[s.program];
    const q = t.quals;
    const course = q.find(x => x.scope === 'course' && x.course_id === s.course_id && (!x.quarter_id || !quarter || x.quarter_id === quarter));
    if (course) return { ok: true, basis: `course authorization ${course.qualification_id || ''}`.trim() };
    if (q.some(x => x.scope === 'program' && x.program === prog)) return { ok: true, basis: `${s.program} program-wide` };
    if (s.program === 'ESL' && s.levels.length && s.levels.every(l => q.some(x => x.scope === 'level' && x.program === 'esl' && x.level === l.toLowerCase())))
      return { ok: true, basis: 'ESL ' + s.levels.join(' + ') };
    return { ok: false, basis: null };
  }

  function blockAdjacent(b1, b2) { return ADJACENT_BLOCKS.some(([x, y]) => (x === b1 && y === b2) || (x === b2 && y === b1)); }

  /** All hard-rule failures for teacher t on standard section s (empty list = eligible). */
  function hardFailures(ctx, t, s) {
    const f = [];
    const qual = qualification(t, s, ctx.quarter);
    if (!qual.ok) f.push({ rule: 'qualification', text: `Not verified for ${s.program}${s.levels.length ? ' ' + s.levels.join('+') : ''}` });
    if (t.avail[s.slot] === 'unavailable') f.push({ rule: 'availability', text: `Unavailable ${DAY_NAMES[s.day]} ${s.block}` });
    if (s.mode === 'In-person') {
      if (t.pref.preferred_campus !== 'no_preference' && s.campus.toLowerCase() !== t.pref.preferred_campus && t.pref.other_campus === 'prohibited')
        f.push({ rule: 'campus', text: `Cannot teach at ${s.campus}` });
    } else if (t.pref.online === 'prohibited') f.push({ rule: 'online', text: 'Not willing to teach online' });
    if (t.mappings.get(s.course_id) === 'prohibited') f.push({ rule: 'course', text: `Stated they cannot teach ${s.name}` });
    if (s.levels.length > 1 && t.mixed === 'prohibited') f.push({ rule: 'mixed_level', text: 'Cannot teach mixed-level classes' });
    for (const r of t.rcls) {
      if (r.day === s.day && r.start < s.end && s.start < r.end) f.push({ rule: 'rcl_overlap', text: `Overlaps manual RCL ${r.id}` });
      else if (ctx.settings.travelRule && r.day === s.day && r.mode === 'In-person' && s.mode === 'In-person' && r.campus !== s.campus && blockAdjacent(r.block, s.block))
        f.push({ rule: 'travel', text: `Back-to-back with manual RCL ${r.id} at ${r.campus}` });
    }
    if (t.effMax <= 0) f.push({ rule: 'max_classes', text: `Maximum classes is ${t.max}${t.rcls.length && t.rclCounts ? ' (RCL counts toward it)' : ''}` });
    if (ctx.excluded.has(t.id + '|' + s.id)) f.push({ rule: 'declined', text: 'Teacher declined this assignment' });
    const lockT = ctx.lockedBySection.get(s.id);
    if (lockT && lockT !== t.id) f.push({ rule: 'locked', text: `Locked to ${lockT}` });
    return { failures: f, qualBasis: qual.basis };
  }

  /** Preference credits for an eligible pair, plus any exceptions it creates. */
  function pairCredits(ctx, t, s) {
    const C = ctx.settings.credits;
    const exc = [];
    const why = [];
    // Campus / delivery mode: a compliance rule, not a scored preference (final corrections §1).
    // 'approved' = may be assigned freely; 'confirm' = may be proposed, but cannot be finalized until the teacher accepts.
    let campusStatus;
    if (s.mode === 'In-person') {
      if (t.pref.preferred_campus === 'no_preference') { campusStatus = 'approved'; why.push(`${s.campus}: no campus preference (either campus compliant)`); }
      else if (s.campus.toLowerCase() === t.pref.preferred_campus) { campusStatus = 'approved'; why.push(`${s.campus}: preferred campus`); }
      else if (t.pref.other_campus === 'acceptable') { campusStatus = 'approved'; why.push(`${s.campus}: other campus, approved by teacher`); }
      else {
        campusStatus = 'confirm'; why.push(`${s.campus}: other campus, needs teacher approval before finalization`);
        exc.push({ category: 'campus', requires_approval: true, affected: 'Other campus: only if needed',
          original: `Prefers ${cap(t.pref.preferred_campus)}`, proposed: `${s.campus} campus` });
      }
    } else {
      const o = t.pref.online;
      if (o === 'preferred' || o === 'acceptable') { campusStatus = 'approved'; why.push(`Online: ${o === 'preferred' ? 'preferred' : 'willing'}`); }
      else {
        campusStatus = 'confirm'; why.push('Online: needs teacher approval before finalization');
        exc.push({ category: 'campus', requires_approval: true, affected: 'Online: only if needed', original: 'In-person teaching', proposed: 'Online delivery' });
      }
    }
    // Time
    let time = null;
    if (t.hasPreferredSlot) {
      time = t.avail[s.slot] === 'preferred' ? C.preferred : C.lessPreferred;
      why.push(`${DAY_NAMES[s.day]} ${s.block}: ${t.avail[s.slot] === 'preferred' ? 'preferred block' : 'available, not preferred'}`);
    } else why.push(`${DAY_NAMES[s.day]} ${s.block}: available (no preferred blocks stated)`);
    // Course
    let course = null;
    const map = t.mappings.get(s.course_id);
    if (map === 'confirm') {
      course = C.confirm; why.push(`${s.name}: listed under "prefer to avoid"`);
      exc.push({ category: 'course', affected: 'Course listed under "prefer to avoid"', original: 'Prefers not to teach this course', proposed: s.name });
    } else if (t.courseApplicable) {
      if (map === 'preferred') { course = C.preferred; why.push(`${s.name}: a preferred course`); }
      else {
        const progOk = t.programPrefs.size === 0 || t.programPrefs.has(s.program);
        const lvlOk = s.program !== 'ESL' || t.levelPrefs.size === 0 || s.levels.every(l => t.levelPrefs.has(l));
        if (progOk && lvlOk) {
          course = t.hasNamedPreferred ? C.acceptable : C.preferred;
          why.push(`${s.name}: in preferred program/level${t.hasNamedPreferred ? ', not a named course' : ''}`);
        } else { course = C.lessPreferred; why.push(`${s.name}: outside preferred programs/levels`); }
      }
    }
    if (s.levels.length > 1) {
      if (t.mixed === 'acceptable' && course != null) { course = Math.min(course, C.acceptable); why.push('Mixed-level: willing'); }
      if (t.mixed === 'confirm') {
        if (course != null) course = Math.min(course, C.confirm);
        why.push('Mixed-level: ask first');
        exc.push({ category: 'course', affected: 'Mixed-level classes: only if needed — ask first', original: 'Single-level classes', proposed: `Mixed-level (${s.levels.join(' + ')})` });
      }
    }
    if (t.d === 0) exc.push({ category: 'workload', affected: 'Desired classes: 0', original: 'Requested no classes', proposed: 'Assigned this class' });
    const w = ctx.settings.weights;
    const a = (time != null ? w.time * time : 0) + (course != null ? w.course * course : 0);
    return { campusStatus, time, course, a, exceptions: exc, why };
  }
  const cap = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

  function computePairs(ctx) {
    ctx.pairs = ctx.T.map(() => new Array(ctx.S.length).fill(null));
    ctx.diag = ctx.T.map(() => new Array(ctx.S.length).fill(null));
    ctx.T.forEach((t, i) => {
      ctx.S.forEach((s, j) => {
        const hf = hardFailures(ctx, t, s);
        ctx.diag[i][j] = hf.failures;
        if (!hf.failures.length) {
          const pc = pairCredits(ctx, t, s);
          ctx.pairs[i][j] = Object.assign(pc, { qualBasis: hf.qualBasis, nexc: pc.exceptions.length ? 1 : 0 });
        }
      });
      const slots = new Set(ctx.S.filter((s, j) => ctx.pairs[i][j]).map(s => s.slot));
      t.K = Math.min(t.effMax, slots.size);
      t.anyEligible = slots.size > 0;
    });
  }

  /* ------------------------------------------------------------------ *
   * 6. Scoring (section 6 of the spec)
   * ------------------------------------------------------------------ */
  function workloadScore(k, d) {
    if (d > 0) return Math.max(0, 1 - Math.abs(k - d) / d);
    return k > 0 ? 0 : null;
  }

  /** Score teacher i given the list of standard section indices assigned to them. */
  function scoreTeacher(ctx, i, js) {
    const t = ctx.T[i], w = ctx.settings.weights;
    const k = js.length;
    const res = { k, time: null, course: null, workload: workloadScore(k, t.d), overall: null, campusApprovalsNeeded: 0 };
    if (k > 0) {
      let m = 0, q = 0, aSum = 0;
      js.forEach(j => {
        const p = ctx.pairs[i][j] || pairCredits(ctx, t, ctx.S[j]); // locked-but-ineligible still scored
        if (p.time != null) m += p.time; if (p.course != null) q += p.course; aSum += p.a;
        if (p.campusStatus === 'confirm') res.campusApprovalsNeeded++;
      });
      res.time = t.hasPreferredSlot ? m / k : null;
      res.course = t.courseApplicable ? q / k : null;
      res.overall = (aSum / k + w.workload * res.workload) / ctx.omega[i];
    } else if (t.d > 0) res.overall = 0;
    return res;
  }

  /* ------------------------------------------------------------------ *
   * 7. Metrics vector used by both solver modes to compare schedules
   * ------------------------------------------------------------------ */
  function metricsOf(ctx, assign /* array j -> i or -1 */) {
    const byT = ctx.T.map(() => []);
    let covered = 0, exceptions = 0;
    assign.forEach((i, j) => {
      if (i >= 0) {
        covered++; byT[i].push(j);
        const p = ctx.pairs[i][j];
        if (p && p.nexc) exceptions++;
      }
    });
    const scores = byT.map((js, i) => scoreTeacher(ctx, i, js));
    const target = ctx.settings.target - SCORE_TOL;
    let met = 0, demand = 0, floor = 1, sum = 0, floorSet = 0;
    ctx.T.forEach((t, i) => {
      const s = scores[i];
      if (t.d > 0) {
        demand++; sum += s.overall;
        if (s.overall >= target) met++;
        if (t.anyEligible && t.K > 0) { floorSet++; floor = Math.min(floor, s.overall); }
      }
    });
    if (!floorSet) floor = null;
    return { covered, total: ctx.S.length, exceptions, met, demand, floor, sum, scores, byT };
  }

  // Lexicographic keys per strategy (higher is better)
  function keyFor(strategy, m, ctx, extra) {
    const fl = m.floor == null ? 1 : m.floor;
    const r = v => Math.round(v * 1e6) / 1e6;
    if (strategy === 'B') return [m.met, m.covered, r(fl), -m.exceptions, r(m.sum)];
    if (strategy === 'C') return [m.covered >= extra.minCoverage ? 1 : 0, m.met, r(fl), m.covered, -m.exceptions, r(m.sum)];
    return [m.covered, m.met, r(fl), -m.exceptions, r(m.sum)];
  }
  function cmpKey(a, b) { for (let x = 0; x < a.length; x++) { if (a[x] > b[x] + 1e-9) return 1; if (a[x] < b[x] - 1e-9) return -1; } return 0; }

  /* ------------------------------------------------------------------ *
   * 8. Exact mode: lexicographic MILP with GLPK
   * ------------------------------------------------------------------ */
  function buildModel(ctx) {
    const w = ctx.settings.weights;
    const xs = []; // {name,i,j}
    const xByI = ctx.T.map(() => []), xByJ = ctx.S.map(() => []);
    ctx.T.forEach((t, i) => ctx.S.forEach((s, j) => {
      const locked = ctx.lockedBySection.get(s.id) === t.id;
      if (ctx.pairs[i][j] || locked) {
        const v = { name: `x_${i}_${j}`, i, j, locked, a: (ctx.pairs[i][j] || pairCredits(ctx, t, s)).a, e: ctx.pairs[i][j] ? ctx.pairs[i][j].nexc : 0 };
        xs.push(v); xByI[i].push(v); xByJ[j].push(v);
      }
    }));
    const rows = [];
    const UP = 3, LO = 2, FX = 5; // GLPK constants (GLP_UP=3, GLP_LO=2, GLP_FX=5)
    ctx.S.forEach((s, j) => { if (xByJ[j].length) rows.push({ name: `sec_${j}`, vars: xByJ[j].map(v => ({ name: v.name, coef: 1 })), bnds: { type: UP, ub: 1, lb: 0 } }); });
    ctx.T.forEach((t, i) => {
      const bySlot = new Map();
      xByI[i].forEach(v => { const sl = ctx.S[v.j].slot; if (!bySlot.has(sl)) bySlot.set(sl, []); bySlot.get(sl).push(v); });
      bySlot.forEach((vs, sl) => { if (vs.length > 1) rows.push({ name: `blk_${i}_${sl}`, vars: vs.map(v => ({ name: v.name, coef: 1 })), bnds: { type: UP, ub: 1, lb: 0 } }); });
      if (ctx.settings.travelRule) {
        DAYS.forEach(day => ADJACENT_BLOCKS.forEach(([b1, b2]) => CAMPUSES.forEach(c => {
          const left = xByI[i].filter(v => { const s = ctx.S[v.j]; return s.day === day && s.block === b1 && s.mode === 'In-person' && s.campus === c; });
          const right = xByI[i].filter(v => { const s = ctx.S[v.j]; return s.day === day && s.block === b2 && s.mode === 'In-person' && s.campus !== c; });
          if (left.length && right.length) rows.push({ name: `trv_${i}_${day}_${b1}${b2}_${c[0]}`, vars: left.concat(right).map(v => ({ name: v.name, coef: 1 })), bnds: { type: UP, ub: 1, lb: 0 } });
        })));
      }
      const K = Math.max(t.K, xByI[i].filter(v => v.locked).length);
      t.Kmodel = K;
      const zs = []; for (let k = 0; k <= K; k++) zs.push({ name: `z_${i}_${k}`, coef: k });
      rows.push({ name: `load_${i}`, vars: xByI[i].map(v => ({ name: v.name, coef: 1 })).concat(zs.map(z => ({ name: z.name, coef: -z.coef }))), bnds: { type: FX, lb: 0, ub: 0 } });
      rows.push({ name: `one_${i}`, vars: zs.map(z => ({ name: z.name, coef: 1 })), bnds: { type: FX, lb: 1, ub: 1 } });
    });
    return { xs, xByI, xByJ, rows, w };
  }

  // Linear "S_i >= theta" rows.
  // withY (target count): disaggregated indicators y(i,k) <= z(i,k); y(i,k)=1 requires S_i >= theta at load k.
  //   sum_j a_ij x_ij - sum_k k*(theta*Omega_i - w_w*W_i(k)) * y_ik >= 0     (no big-M, tight LP relaxation)
  // hard form (floor): sum_j a_ij x_ij + sum_k z_ik * k*(w_w*W_i(k) - theta*Omega_i) >= 0, and z_i0 = 0 when theta > 0.
  function scoreRows(ctx, model, theta, { withY, teachers }) {
    const w = ctx.settings.weights, rows = [];
    teachers.forEach(i => {
      const t = ctx.T[i], om = ctx.omega[i], K = t.Kmodel;
      const vars = model.xByI[i].map(v => ({ name: v.name, coef: v.a }));
      // Upper bound on S at load k: every class at the teacher's best placement credit.
      // If even that cannot reach theta, load k cannot qualify: fix it out (tightens the model, changes no answer).
      const aMax = model.xByI[i].reduce((m, v) => Math.max(m, v.a), 0);
      const th = theta - SCORE_TOL;
      const reachable = k => (aMax + w.workload * workloadScore(k, t.d)) / om >= th;
      if (withY) {
        for (let k = 1; k <= K; k++) {
          if (!reachable(k)) { rows.push({ name: `yx_${i}_${k}`, vars: [{ name: `y_${i}_${k}`, coef: 1 }], bnds: { type: 5, lb: 0, ub: 0 } }); continue; }
          vars.push({ name: `y_${i}_${k}`, coef: -k * (th * om - w.workload * workloadScore(k, t.d)) });
          rows.push({ name: `yz_${i}_${k}`, vars: [{ name: `y_${i}_${k}`, coef: 1 }, { name: `z_${i}_${k}`, coef: -1 }], bnds: { type: 3, ub: 0, lb: 0 } });
        }
        rows.push({ name: `tgt_${i}`, vars, bnds: { type: 2, lb: -1e-7, ub: 0 } });
      } else {
        for (let k = 1; k <= K; k++) {
          if (!reachable(k)) rows.push({ name: `fx_${i}_${k}`, vars: [{ name: `z_${i}_${k}`, coef: 1 }], bnds: { type: 5, lb: 0, ub: 0 } });
          else vars.push({ name: `z_${i}_${k}`, coef: k * (w.workload * workloadScore(k, t.d) - th * om) });
        }
        rows.push({ name: `flr_${i}`, vars, bnds: { type: 2, lb: -1e-7, ub: 0 } });
        if (t.d > 0 && theta > 0) rows.push({ name: `fz0_${i}`, vars: [{ name: `z_${i}_0`, coef: 1 }], bnds: { type: 5, lb: 0, ub: 0 } });
      }
    });
    return rows;
  }

  async function solveLP(glpk, ctx, model, extraRows, objective, direction, extraBinaries = [], extraBounds = []) {
    const lp = {
      name: 'approach',
      objective: { direction, name: 'obj', vars: objective.length ? objective : [{ name: model.xs[0] ? model.xs[0].name : 'dummy', coef: 0 }] },
      subjectTo: model.rows.concat(extraRows),
      bounds: model.xs.filter(v => v.locked).map(v => ({ name: v.name, type: 5, lb: 1, ub: 1 })).concat(extraBounds),
      binaries: model.xs.map(v => v.name)
        .concat(ctx.T.flatMap((t, i) => Array.from({ length: t.Kmodel + 1 }, (_, k) => `z_${i}_${k}`)))
        .concat(extraBinaries)
    };
    const remaining = ctx._deadline ? Math.max(1, (ctx._deadline - Date.now()) / 1000) : ctx.settings.timeLimitSec;
    let r = glpk.solve(lp, { msglev: glpk.GLP_MSG_OFF, tmlim: Math.min(ctx.settings.timeLimitSec, remaining), mipgap: 0, presol: true });
    if (r && typeof r.then === 'function') r = await r;
    const st = r.result.status;
    const ok = st === glpk.GLP_OPT || st === glpk.GLP_FEAS;
    if (typeof process !== 'undefined' && process.env && process.env.SCHED_DEBUG) console.log('  solve', lp.subjectTo.length, 'rows', 'status', st, 'z', r.result.z, 't', r.time);
    return { ok, proven: st === glpk.GLP_OPT, infeasible: st === glpk.GLP_NOFEAS || st === glpk.GLP_INFEAS, status: st, z: r.result.z, vars: r.result.vars, time: r.time };
  }

  function assignFromVars(ctx, model, vars) {
    const assign = new Array(ctx.S.length).fill(-1);
    model.xs.forEach(v => { if (vars[v.name] > 0.5) assign[v.j] = v.i; });
    return assign;
  }

  async function solveExact(ctx, glpk, strategy, opts = {}) {
    const model = buildModel(ctx);
    const yNames = ctx.T.flatMap((t, i) => (t.d > 0 ? Array.from({ length: t.Kmodel }, (_, k) => `y_${i}_${k + 1}`) : []));
    const yTeachers = ctx.T.map((t, i) => (t.d > 0 ? i : -1)).filter(i => i >= 0);
    const floorTeachers = ctx.T.map((t, i) => (t.d > 0 && t.anyEligible && t.Kmodel > 0 ? i : -1)).filter(i => i >= 0);
    const tgtRows = scoreRows(ctx, model, ctx.settings.target, { withY: true, teachers: yTeachers });
    const cover = model.xs.map(v => ({ name: v.name, coef: 1 }));
    const yObj = yNames.map(n => ({ name: n, coef: 1 }));
    const fixed = [];
    let proven = true; const stages = []; let last = null; let tmp = null;
    const MAX = 2, MIN = 1;
    const noGood = opts.noGood || [];

    const evalObj = (obj, vars) => obj.reduce((t, o) => t + o.coef * (vars[o.name] || 0), 0);
    // Each stage keeps the previous stage's solution as a fallback: it satisfies every constraint fixed so far,
    // so if a stage runs out of time the engine keeps it and labels the result "not proven optimal".
    // Does a known solution satisfy every row currently in force? (Used to keep the better of solver vs. incumbent.)
    const satisfies = (rows, vars) => rows.every(row => {
      const v = row.vars.reduce((t, o) => t + o.coef * (vars[o.name] || 0), 0), b = row.bnds, eps = 1e-6;
      if (b.type === 2) return v >= b.lb - eps;
      if (b.type === 3) return v <= b.ub + eps;
      if (b.type === 5) return Math.abs(v - b.lb) <= eps;
      if (b.type === 4) return v >= b.lb - eps && v <= b.ub + eps;
      return true;
    });
    const better = (a, b2, dir) => (dir === MAX ? a > b2 + 1e-9 : a < b2 - 1e-9);
    // Clean a known solution: round x and z, then set each y from the teacher's exact score (no solver tolerance).
    const normalize = vars => {
      const v = {};
      model.xs.forEach(x => { v[x.name] = vars[x.name] > 0.5 ? 1 : 0; });
      const assign = new Array(ctx.S.length).fill(-1);
      model.xs.forEach(x => { if (v[x.name]) assign[x.j] = x.i; });
      const m = metricsOf(ctx, assign);
      ctx.T.forEach((t, i) => {
        const k = m.byT[i].length;
        for (let kk = 0; kk <= t.Kmodel; kk++) v[`z_${i}_${kk}`] = kk === k ? 1 : 0;
        if (t.d > 0) for (let kk = 1; kk <= t.Kmodel; kk++) v[`y_${i}_${kk}`] = (kk === k && m.scores[i].overall >= ctx.settings.target - SCORE_TOL) ? 1 : 0;
      });
      return v;
    };
    const incumbents = [];
    (opts.seeds || []).forEach(v => incumbents.push(normalize(v)));
    const run = async (label, obj, dir, rowsExtra = [], bound = null) => {
      const rows = tgtRows.concat(fixed, noGood, rowsExtra);
      // If a known valid solution already reaches a proven bound for this goal, it is optimal: no solve needed.
      if (bound != null) {
        for (const vars of [last && normalize(last.vars)].concat(incumbents).filter(Boolean)) {
          if (satisfies(model.rows.concat(rows), vars) && Math.abs(evalObj(obj, vars) - bound) < 1e-6) {
            stages.push({ stage: label, value: round4(bound), proven: true, note: 'Reaches the proven maximum from candidate A' });
            last = { ok: true, proven: true, z: bound, vars }; return last;
          }
        }
      }
      let r = await solveLP(glpk, ctx, model, rows, obj, dir, yNames);
      if (bound != null && r.ok && Math.abs(r.z - bound) < 1e-6) r.proven = true;
      if (!r.proven) {
        // Solver stopped early: if a known solution (previous stage or another candidate) is valid and better, keep it.
        for (const vars of [last && normalize(last.vars)].concat(incumbents).filter(Boolean)) {
          if (!satisfies(model.rows.concat(rows), vars)) { if (typeof process !== 'undefined' && process.env.SCHED_DEBUG) { const bad = model.rows.concat(rows).find(row => !satisfies([row], vars)); console.log('  incumbent rejected by', bad && bad.name); } continue; }
          const z = evalObj(obj, vars);
          if (!r.ok || better(z, r.z, dir)) r = { ok: true, proven: false, z, vars, time: r.time, fromIncumbent: true };
        }
      }
      if (r.ok) {
        proven = proven && r.proven;
        stages.push({ stage: label, value: round4(r.z), proven: r.proven, timeSec: r.time, note: r.proven ? undefined : 'Time limit reached; best known valid solution kept' });
        last = r; return r;
      }
      if (r.infeasible || !last) { failure = r.infeasible ? 'infeasible' : 'timeout'; return null; }
      proven = false;
      const z = evalObj(obj, last.vars);
      stages.push({ stage: label, value: round4(z), proven: false, note: 'Time limit reached; kept the previous solution' });
      return { ok: true, z, vars: last.vars };
    };
    let failure = null;
    const fixCoverage = z => fixed.push({ name: 'fix_cov', vars: cover, bnds: { type: 2, lb: Math.round(z) - 1e-6, ub: 0 } });
    const fixY = z => fixed.push({ name: 'fix_y', vars: yObj.length ? yObj : cover.slice(0, 1).map(c => ({ name: c.name, coef: 0 })), bnds: { type: 2, lb: Math.round(z) - 1e-6, ub: 0 } });

    if (strategy === 'B') {
      if (!(tmp = await run('Teachers at 80%', yObj, MAX))) return { failed: failure }; fixY(tmp.z);
      if (!(tmp = await run('Coverage', cover, MAX, [], opts.coverageProven ? opts.coverageMax : null))) return { failed: failure }; fixCoverage(tmp.z);
    } else if (strategy === 'C') {
      const minCov = Math.max(0, opts.coverageMax - ctx.settings.balancedTolerance);
      fixed.push({ name: 'fix_cov', vars: cover, bnds: { type: 2, lb: minCov - 1e-6, ub: 0 } });
      if (!(tmp = await run('Teachers at 80%', yObj, MAX))) return { failed: failure }; fixY(tmp.z);
    } else {
      if (!(tmp = await run('Coverage', cover, MAX))) return { failed: failure }; fixCoverage(tmp.z);
      if (!(tmp = await run('Teachers at 80%', yObj, MAX))) return { failed: failure }; fixY(tmp.z);
    }

    // Stage: raise the lowest score (bisection on whole percent)
    let best = last; let floorPct = null; let floorUnknown = false;
    if (floorTeachers.length) {
      const cur = metricsOf(ctx, assignFromVars(ctx, model, last.vars));
      let lo = Math.max(0, Math.floor((cur.floor == null ? 0 : cur.floor) * 100 + SCORE_TOL * 100)), hi = 100;
      while (lo < hi) {
        const mid = Math.ceil((lo + hi) / 2);
        const r = await solveLP(glpk, ctx, model, tgtRows.concat(fixed, noGood, scoreRows(ctx, model, mid / 100, { withY: false, teachers: floorTeachers })), yObj, MAX, yNames);
        if (r.ok) { lo = mid; best = r; last = r; }
        else { hi = mid - 1; if (!r.infeasible) { proven = false; floorUnknown = true; } }
      }
      floorPct = lo;
      fixed.push(...scoreRows(ctx, model, lo / 100, { withY: false, teachers: floorTeachers }));
      stages.push({ stage: 'Lowest score (floor, whole percent)', value: lo / 100, proven: !floorUnknown, note: floorUnknown ? 'A higher floor could not be ruled out within the time limit' : undefined });
    }
    // Balanced: give back any coverage that bought no gain on goals 2-3 (Q13: never trade coverage for average alone)
    if (strategy === 'C') {
      if (!(tmp = await run('Coverage (restored where it costs no teacher)', cover, MAX, [], opts.coverageProven ? opts.coverageMax : null))) return { failed: failure };
      fixCoverage(tmp.z);
    }
    // Stage: fewest exceptions
    const excObj = model.xs.filter(v => v.e).map(v => ({ name: v.name, coef: 1 }));
    if (excObj.length) {
      // Fewest exceptions, found by bisection on "exceptions <= E" feasibility tests. GLPK solves these quickly,
      // while a direct "minimize exceptions" objective often fails to find any point within the time limit.
      const countOf = vars => Math.round(excObj.reduce((t, o) => t + (vars[o.name] || 0), 0));
      let hiE = countOf(last.vars), loE = 0, excProven = true, bestVars = last.vars;
      while (loE < hiE) {
        const mid = Math.floor((loE + hiE) / 2);
        const r = await solveLP(glpk, ctx, model, tgtRows.concat(fixed, noGood, [{ name: 'exc_le', vars: excObj, bnds: { type: 3, ub: mid + 1e-6, lb: 0 } }]), yObj.length ? yObj : cover, MAX, yNames);
        if (r.ok) { hiE = Math.min(mid, countOf(r.vars)); bestVars = r.vars; last = r; }
        else { loE = mid + 1; if (!r.infeasible) excProven = false; }
      }
      if (!excProven) proven = false;
      stages.push({ stage: 'Exceptions', value: hiE, proven: excProven, note: excProven ? undefined : 'Fewer exceptions could not be ruled out within the time limit' });
      fixed.push({ name: 'fix_exc', vars: excObj, bnds: { type: 3, ub: hiE + 1e-6, lb: 0 } });
    }
    // Stage: total satisfaction (exact via q helper variables)
    const qRows = [], qObj = [], qBounds = [];
    yTeachers.forEach(i => {
      const t = ctx.T[i], om = ctx.omega[i], K = t.Kmodel, w = ctx.settings.weights;
      const aMax = model.xByI[i].reduce((m, v) => Math.max(m, v.a), 0);
      const sumQ = [];
      for (let k = 1; k <= K; k++) {
        const q = `q_${i}_${k}`;
        qBounds.push({ name: q, type: 2, lb: 0, ub: 0 });
        qRows.push({ name: `qz_${i}_${k}`, vars: [{ name: q, coef: 1 }, { name: `z_${i}_${k}`, coef: -k * aMax }], bnds: { type: 3, ub: 0, lb: 0 } });
        sumQ.push({ name: q, coef: 1 });
        qObj.push({ name: q, coef: 1 / (k * om) });
        qObj.push({ name: `z_${i}_${k}`, coef: w.workload * workloadScore(k, t.d) / om });
      }
      if (sumQ.length) qRows.push({ name: `qs_${i}`, vars: sumQ.concat(model.xByI[i].map(v => ({ name: v.name, coef: -v.a }))), bnds: { type: 3, ub: 0, lb: 0 } });
    });
    const r5 = await solveLP(glpk, ctx, model, tgtRows.concat(fixed, noGood, qRows), qObj.length ? qObj : cover, MAX, yNames, qBounds);
    if (r5.ok) { proven = proven && r5.proven; stages.push({ stage: 'Total satisfaction', value: round4(r5.z), proven: r5.proven }); last = r5; }
    else { proven = false; stages.push({ stage: 'Total satisfaction', value: null, proven: false, note: 'Time limit reached; kept the previous solution' }); }
    return { assign: assignFromVars(ctx, model, last.vars), proven, stages, model, vars: last.vars };
  }

  /* ------------------------------------------------------------------ *
   * 9. Heuristic mode: most-constrained greedy + deterministic local search
   * ------------------------------------------------------------------ */
  function makeState(ctx, assign) {
    const st = { assign: assign.slice(), load: ctx.T.map(() => 0), slot: ctx.T.map(() => new Map()) };
    assign.forEach((i, j) => { if (i >= 0) { st.load[i]++; st.slot[i].set(ctx.S[j].slot, j); } });
    return st;
  }
  function canPlace(ctx, st, i, j, ignoreJ = -1) {
    const t = ctx.T[i], s = ctx.S[j];
    const locked = ctx.lockedBySection.get(s.id);
    if (locked && locked !== t.id) return false;
    if (!ctx.pairs[i][j] && locked !== t.id) return false;
    const occ = st.slot[i].get(s.slot);
    if (occ != null && occ !== ignoreJ) return false;
    const loadAfter = st.load[i] + 1 - (ignoreJ >= 0 && st.assign[ignoreJ] === i ? 1 : 0);
    if (loadAfter > Math.max(t.K, 0) && locked !== t.id) return false;
    if (ctx.settings.travelRule && s.mode === 'In-person') {
      for (const [sl, jj] of st.slot[i]) {
        if (jj === ignoreJ) continue;
        const o = ctx.S[jj];
        if (o.day === s.day && o.mode === 'In-person' && o.campus !== s.campus && blockAdjacent(o.block, s.block)) return false;
      }
    }
    return true;
  }
  function place(ctx, st, i, j) { st.assign[j] = i; st.load[i]++; st.slot[i].set(ctx.S[j].slot, j); }
  function unplace(ctx, st, j) { const i = st.assign[j]; if (i < 0) return; st.assign[j] = -1; st.load[i]--; st.slot[i].delete(ctx.S[j].slot); }

  function solveHeuristic(ctx, strategy, opts = {}) {
    const rng = mulberry32(ctx.settings.seed + (strategy.charCodeAt(0) * 7919) + (opts.salt || 0));
    const st = makeState(ctx, new Array(ctx.S.length).fill(-1));
    // Locked first
    ctx.S.forEach((s, j) => { const lt = ctx.lockedBySection.get(s.id); if (lt != null && ctx.tIndex.has(lt)) place(ctx, st, ctx.tIndex.get(lt), j); });
    // Most constrained section first
    const elig = ctx.S.map((s, j) => ctx.T.reduce((n, t, i) => n + (ctx.pairs[i][j] ? 1 : 0), 0));
    const order = ctx.S.map((s, j) => j).filter(j => st.assign[j] < 0)
      .sort((a, b) => elig[a] - elig[b] || ctx.S[a].id.localeCompare(ctx.S[b].id));
    order.forEach(j => {
      let bestI = -1, bestKey = null;
      ctx.T.forEach((t, i) => {
        if (!canPlace(ctx, st, i, j)) return;
        const p = ctx.pairs[i][j];
        const key = [st.load[i] < t.d ? 1 : 0, -p.nexc, p.a, -st.load[i]];
        if (!bestKey || cmpKey(key, bestKey) > 0) { bestKey = key; bestI = i; }
      });
      if (bestI >= 0) place(ctx, st, bestI, j);
    });
    const avoid = opts.avoid || null; // A2: Set of "i|j" from A
    const keyOf = () => {
      const m = metricsOf(ctx, st.assign);
      const k = keyFor(strategy === 'A2' ? 'A' : strategy, m, ctx, opts);
      if (avoid) {
        let diff = 0; st.assign.forEach((i, j) => { if (i >= 0 && !avoid.has(i + '|' + j) && !ctx.lockedBySection.has(ctx.S[j].id)) diff++; });
        k.unshift(diff >= ctx.settings.alternativeMinChanges ? 1 : 0);
      }
      return k;
    };
    let cur = keyOf();
    for (let pass = 0; pass < ctx.settings.heuristicMaxPasses; pass++) {
      let improved = false;
      const js = seededShuffle(ctx.S.map((s, j) => j), rng);
      for (const j of js) {
        if (ctx.lockedBySection.has(ctx.S[j].id)) continue;
        const from = st.assign[j];
        // (a) move / assign
        for (const i of seededShuffle(ctx.T.map((t, i) => i), rng)) {
          if (i === from) continue;
          if (!canPlace(ctx, st, i, j, from === i ? j : -1)) continue;
          unplace(ctx, st, j); place(ctx, st, i, j);
          const k = keyOf();
          if (cmpKey(k, cur) > 0) { cur = k; improved = true; break; }
          unplace(ctx, st, j); if (from >= 0) place(ctx, st, from, j);
        }
        // (b) unassign (only useful for B/C/A2 orderings)
        if (st.assign[j] >= 0 && (strategy !== 'A')) {
          const f2 = st.assign[j]; unplace(ctx, st, j);
          const k = keyOf();
          if (cmpKey(k, cur) > 0) { cur = k; improved = true; } else place(ctx, st, f2, j);
        }
        // (c) swap with another assigned section
        const a = st.assign[j];
        if (a < 0) continue;
        for (const j2 of js) {
          const b = st.assign[j2];
          if (j2 === j || b < 0 || b === a || ctx.lockedBySection.has(ctx.S[j2].id)) continue;
          unplace(ctx, st, j); unplace(ctx, st, j2);
          let ok = false;
          if (canPlace(ctx, st, b, j)) {
            place(ctx, st, b, j);
            if (canPlace(ctx, st, a, j2)) { place(ctx, st, a, j2); ok = true; } else unplace(ctx, st, j);
          }
          if (ok) {
            const k = keyOf();
            if (cmpKey(k, cur) > 0) { cur = k; improved = true; break; }
            unplace(ctx, st, j2); unplace(ctx, st, j);
          }
          place(ctx, st, a, j); place(ctx, st, b, j2);
        }
      }
      if (!improved) break;
    }
    return { assign: st.assign, proven: false, stages: [{ stage: 'Heuristic search', value: null, proven: false }] };
  }

  /* ------------------------------------------------------------------ *
   * 10. Independent validator (re-derives every hard rule from raw data)
   * ------------------------------------------------------------------ */
  function validateSchedule(project, assignments, settingsOverride) {
    const settings = deepMerge(DEFAULT_SETTINGS, Object.assign({}, project.settings, settingsOverride));
    const errors = [];
    const secs = new Map((project.sections || []).map(s => [s.id, s]));
    const teachers = new Map((project.teachers || []).map(t => [t.teacher_id, t]));
    const prefs = new Map((project.preferences || []).map(p => [p.teacher_id, p]));
    const quals = project.qualifications || [];
    const seenSection = new Map();
    const perTeacher = new Map();
    const add = (tid, item) => { if (!perTeacher.has(tid)) perTeacher.set(tid, []); perTeacher.get(tid).push(item); };

    for (const a of assignments) {
      const s = secs.get(a.section_id);
      if (!s) { errors.push(`${a.section_id}: section not in course data`); continue; }
      if (s.type !== 'Standard') errors.push(`${s.id}: engine assigned a non-standard (RCL) section`);
      if (seenSection.has(s.id)) errors.push(`${s.id}: assigned to more than one teacher (${seenSection.get(s.id)}, ${a.teacher_id})`);
      seenSection.set(s.id, a.teacher_id);
      const t = teachers.get(a.teacher_id), p = prefs.get(a.teacher_id);
      if (!t || (t.status && t.status !== 'active')) { errors.push(`${s.id}: teacher ${a.teacher_id} is not active`); continue; }
      if (!p) { errors.push(`${s.id}: teacher ${a.teacher_id} has no preferences on file`); continue; }
      // operating hours
      const blockOk = (s.day !== 'SAT' || s.start < 1080) && ['AM', 'PM', 'EV'].some(b => s.start === BLOCKS[b].start && s.end === BLOCKS[b].end);
      if (!blockOk) errors.push(`${s.id}: outside a permitted block`);
      // qualification
      const tq = quals.filter(q => q.teacher_id === a.teacher_id && (!q.status || q.status === 'verified'));
      const pk = PROGRAM_KEY[s.program];
      const qualified = tq.some(q => q.scope === 'program' && q.program === pk)
        || tq.some(q => q.scope === 'course' && q.course_id === s.course_id)
        || (s.program === 'ESL' && s.levels.length > 0 && s.levels.every(l => tq.some(q => q.scope === 'level' && q.level === l.toLowerCase())));
      if (!qualified) errors.push(`${s.id}: ${a.teacher_id} is not verified for this course`);
      // availability
      const slot = s.day + '_' + (s.start === 540 ? 'AM' : s.start === 840 ? 'PM' : 'EV');
      if (!p.availability || !p.availability[slot] || p.availability[slot] === 'unavailable') errors.push(`${s.id}: ${a.teacher_id} is unavailable ${slot}`);
      // campus / online / course / mixed prohibitions
      if (s.mode === 'In-person' && p.preferred_campus !== 'no_preference' && s.campus.toLowerCase() !== p.preferred_campus && p.other_campus === 'prohibited')
        errors.push(`${s.id}: ${a.teacher_id} cannot teach at ${s.campus}`);
      if (s.mode === 'Online' && p.online === 'prohibited') errors.push(`${s.id}: ${a.teacher_id} is not willing to teach online`);
      if ((p.courseMappings || []).some(m => m.course_id === s.course_id && m.preference === 'prohibited')) errors.push(`${s.id}: ${a.teacher_id} stated they cannot teach this course`);
      if (s.levels.length > 1 && p.mixed_level === 'prohibited') errors.push(`${s.id}: ${a.teacher_id} cannot teach mixed-level classes`);
      if ((project.excludedPairs || []).some(e => e.teacher_id === a.teacher_id && e.section_id === s.id)) errors.push(`${s.id}: ${a.teacher_id} declined this assignment`);
      add(a.teacher_id, s);
    }
    // locked assignments preserved
    (project.locked || []).forEach(l => {
      if (seenSection.get(l.section_id) !== l.teacher_id) errors.push(`Locked assignment ${l.section_id} → ${l.teacher_id} was not preserved`);
    });
    // per-teacher: overlap (incl. RCL), travel, maximum
    const rclMap = new Map();
    (project.rclAssignments || []).forEach(ra => { const s = secs.get(ra.section_id); if (s) { if (!rclMap.has(ra.teacher_id)) rclMap.set(ra.teacher_id, []); rclMap.get(ra.teacher_id).push(s); } });
    for (const [tid, list] of perTeacher) {
      const rcls = rclMap.get(tid) || [];
      const all = list.concat(rcls);
      for (let a = 0; a < all.length; a++) for (let b = a + 1; b < all.length; b++) {
        const x = all[a], y = all[b];
        if (x.day !== y.day) continue;
        if (x.start < y.end && y.start < x.end) { errors.push(`${tid}: ${x.id} overlaps ${y.id}`); continue; }
        if (settings.travelRule && x.mode === 'In-person' && y.mode === 'In-person' && x.campus !== y.campus) {
          const bx = BLOCK_ORDER.find(k => x.start >= BLOCKS[k].start && x.end <= BLOCKS[k].end);
          const by = BLOCK_ORDER.find(k => y.start >= BLOCKS[k].start && y.end <= BLOCKS[k].end);
          if (Math.abs(BLOCK_ORDER.indexOf(bx) - BLOCK_ORDER.indexOf(by)) === 1) errors.push(`${tid}: ${x.id} (${x.campus}) and ${y.id} (${y.campus}) are back-to-back at different campuses`);
        }
      }
      const p = prefs.get(tid);
      const cfg = (project.teacherConfig || []).find(c => c.teacher_id === tid) || {};
      if (rcls.length && cfg.rcl_counts_toward_max !== true && cfg.rcl_counts_toward_max !== false) errors.push(`${tid}: has manual RCL but "RCL counts toward maximum" is not set`);
      const rclLoad = cfg.rcl_counts_toward_max === true ? 0.5 * rcls.length : 0;
      if (p && list.length + rclLoad > +p.max_classes + 1e-9) errors.push(`${tid}: ${list.length} classes${rclLoad ? ' + ' + rcls.length + ' RCL' : ''} exceeds stated maximum ${p.max_classes}`);
    }
    return { valid: errors.length === 0, errors };
  }

  /* ------------------------------------------------------------------ *
   * 10b. Campus compliance and finalization gate (final corrections §1, Q16)
   * ------------------------------------------------------------------ */
  function campusComplianceOf(ctx, assign, approvals) {
    let total = 0, approved = 0, awaiting = 0;
    const pending = [];
    assign.forEach((i, j) => {
      if (i < 0) return;
      total++;
      const t = ctx.T[i], s = ctx.S[j];
      const p = ctx.pairs[i][j] || pairCredits(ctx, t, s);
      if (p.campusStatus === 'approved') approved++;
      else if (approvals && approvals.has(t.id + '|' + s.id)) approved++;
      else { awaiting++; pending.push({ teacher_id: t.id, section_id: s.id, location: s.mode === 'Online' ? 'Online' : s.campus }); }
    });
    return { assignments: total, compliant: approved, awaitingTeacherApproval: awaiting, rate: total ? round4(approved / total) : 1, pending };
  }

  const APPROVED_STATUSES = new Set(['teacher_accepted']);
  const isApproved = e => APPROVED_STATUSES.has(e.status) || (e.status === 'resolved' && e.resolution === 'assignment_confirmed');

  /**
   * checkFinalization(project, candidate, exceptionRecords, { approver })
   * Returns { canFinalize, blockers[], campusCompliance }. Finalization requires:
   *  - every hard rule satisfied (independent validator, incl. prohibited campuses);
   *  - 100% campus compliance: every "only if needed" campus/online assignment accepted by the teacher;
   *  - every other exception accepted or resolved; every unassigned section resolved by an admin;
   *  - every manual RCL entered by an admin; the action taken by the designated approver.
   * The approver check is recorded only; a static site cannot enforce it securely.
   */
  function checkFinalization(project, candidate, exceptionRecords = [], { approver } = {}) {
    const ctx = buildContext(project);
    const blockers = [];
    if (ctx.issues.blocking.length) blockers.push(...ctx.issues.blocking);
    const assignments = candidate.assignments.map(a => ({ section_id: a.section_id, teacher_id: a.teacher_id }));
    const v = validateSchedule(project, assignments);
    v.errors.forEach(e => blockers.push('Hard rule: ' + e));
    const approvals = new Set(exceptionRecords.filter(e => e.category === 'campus' && isApproved(e)).map(e => e.teacher_id + '|' + e.section_id));
    const assign = new Array(ctx.S.length).fill(-1);
    assignments.forEach(a => { const j = ctx.secIndex.get(a.section_id), i = ctx.tIndex.get(a.teacher_id); if (j != null && i != null) assign[j] = i; });
    const cc = campusComplianceOf(ctx, assign, approvals);
    cc.pending.forEach(p => blockers.push(`Campus compliance: ${p.teacher_id} has not approved ${p.section_id} (${p.location})`));
    exceptionRecords.forEach(e => {
      if (e.category === 'campus') return; // handled above
      if (e.exception_class === 'negotiable_preference' && !isApproved(e)) blockers.push(`Exception ${e.exception_id} (${e.category}, ${e.teacher_id}, ${e.section_id}) is ${e.status}`);
      if (e.exception_class === 'unresolved_assignment' && e.status !== 'resolved') blockers.push(`Unassigned section ${e.section_id} not yet resolved by an admin`);
    });
    (project.rclAssignments || []).forEach(r => { if (!r.entered_by) blockers.push(`Manual RCL ${r.section_id} has no administrator recorded`); });
    const designated = ctx.settings.designatedApprover;
    if (!designated) blockers.push('No designated approver set in Settings (Q16)');
    else if (!approver || approver.toLowerCase() !== designated.toLowerCase()) blockers.push(`Only the designated approver (${designated}) can finalize (recorded, not securely enforced)`);
    return { canFinalize: blockers.length === 0, blockers, campusCompliance: cc };
  }

  /* ------------------------------------------------------------------ *
   * 11. Reporting: teacher reports, exceptions, unassigned diagnosis, emails
   * ------------------------------------------------------------------ */
  function describeSection(s) {
    return `${s.name} (${s.id}), ${DAY_NAMES[s.day]} ${fmtTime(s.start)}–${fmtTime(s.end)}, ${s.mode === 'Online' ? 'Online' : s.campus}`;
  }

  function buildReport(ctx, assign, meta) {
    const m = metricsOf(ctx, assign);
    const assignments = [];
    assign.forEach((i, j) => {
      if (i < 0) return;
      const s = ctx.S[j], t = ctx.T[i], p = ctx.pairs[i][j];
      const alts = ctx.T.filter((tt, ii) => ii !== i && ctx.pairs[ii][j]).map(tt => tt.id);
      assignments.push({
        section_id: s.id, teacher_id: t.id, locked: ctx.lockedBySection.get(s.id) === t.id,
        source: ctx.lockedBySection.get(s.id) === t.id ? 'locked' : 'engine',
        reason: p ? [`Qualified: ${p.qualBasis}`].concat(p.why).concat([`Other eligible teachers: ${alts.length ? alts.join(', ') : 'none'}`]).join('. ') + '.'
          : 'Locked by administrator; this pair no longer passes all hard rules (see validation).'
      });
    });

    // Exceptions
    const exceptions = [];
    let n = 0;
    const nextId = () => `EX-${meta.id}-${String(++n).padStart(3, '0')}`;
    assign.forEach((i, j) => {
      if (i < 0) return;
      const p = ctx.pairs[i][j]; if (!p || !p.exceptions.length) return;
      const s = ctx.S[j], t = ctx.T[i];
      const before = m.scores[i].overall;
      const without = scoreTeacher(ctx, i, m.byT[i].filter(x => x !== j)).overall;
      p.exceptions.forEach(e => exceptions.push(Object.assign({
        exception_id: nextId(), exception_class: 'negotiable_preference', section_id: s.id, teacher_id: t.id,
        day: s.day, start_time: fmtTime(s.start), end_time: fmtTime(s.end), campus_or_mode: s.mode === 'Online' ? 'Online' : s.campus,
        score_with: round4(before), score_without: round4(without), status: 'pending_review', admin_notes: ''
      }, e, { email: emailDraft(ctx, t, s, e) })));
    });

    const unassigned = [];
    assign.forEach((i, j) => {
      if (i >= 0) return;
      const s = ctx.S[j];
      const blockedByOne = [];
      ctx.T.forEach((t, ii) => {
        const f = ctx.diag[ii][j].filter(x => x.rule !== 'locked' && x.rule !== 'declined');
        if (f.length === 1) blockedByOne.push({ teacher_id: t.id, rule: f[0].rule, detail: f[0].text });
      });
      const eligibleButBusy = ctx.T.filter((t, ii) => ctx.pairs[ii][j]).map(t => t.id);
      unassigned.push({ section_id: s.id, description: describeSection(s), eligibleTeachers: eligibleButBusy, blockedByOneRule: blockedByOne });
      exceptions.push({
        exception_id: nextId(), exception_class: 'unresolved_assignment', category: 'unassigned', section_id: s.id, teacher_id: null,
        day: s.day, start_time: fmtTime(s.start), end_time: fmtTime(s.end), campus_or_mode: s.mode === 'Online' ? 'Online' : s.campus,
        affected: 'Course coverage', original: 'Section needs a teacher',
        proposed: eligibleButBusy.length ? `Eligible but fully used elsewhere: ${eligibleButBusy.join(', ')}` : 'No eligible teacher',
        status: 'pending_review', admin_notes: ''
      });
      blockedByOne.forEach(b => exceptions.push({
        exception_id: nextId(), exception_class: 'hard_constraint_change', category: b.rule === 'qualification' ? 'qualification_mismatch' : (b.rule === 'availability' ? 'availability_conflict' : 'other_rule'),
        section_id: s.id, teacher_id: b.teacher_id, day: s.day, start_time: fmtTime(s.start), end_time: fmtTime(s.end),
        campus_or_mode: s.mode === 'Online' ? 'Online' : s.campus, affected: b.rule, original: b.detail,
        proposed: 'Only possible if the teacher\'s record is formally changed by an admin; never auto-assigned',
        status: 'pending_review', admin_notes: ''
      }));
    });

    const excCount = new Map();
    exceptions.forEach(e => { if (e.teacher_id && e.exception_class === 'negotiable_preference') excCount.set(e.teacher_id, (excCount.get(e.teacher_id) || 0) + 1); });

    const teacherReports = ctx.T.map((t, i) => {
      const sc = m.scores[i];
      const flags = [];
      if (t.d > 0 && sc.overall < ctx.settings.target - SCORE_TOL) flags.push(`Below ${Math.round(ctx.settings.target * 100)}% target`);
      if (t.d > 0 && sc.k === 0) flags.push('Unmet workload demand: 0 classes assigned' + (t.anyEligible ? ' (eligible sections went to others to maximize coverage/targets)' : ' (no eligible section this quarter)'));
      if (sc.k < t.min) flags.push(`Below stated minimum (${sc.k} < ${t.min})`);
      if (sc.k > t.d) flags.push(`${sc.k - t.d} above desired`);
      if (sc.k < t.d && sc.k > 0) flags.push(`${t.d - sc.k} below desired`);
      const unmet = [];
      m.byT[i].forEach(j => {
        const p = ctx.pairs[i][j]; if (!p) return;
        if (p.campusStatus === 'confirm') unmet.push(`${ctx.S[j].id}: ${p.why[0]}`);
        if (p.time != null && p.time < 1) unmet.push(`${ctx.S[j].id}: block not preferred`);
        if (p.course != null && p.course < 1) unmet.push(`${ctx.S[j].id}: course credit ${pct(p.course)}`);
      });
      const rclHours = t.rcls.length * 2;
      return {
        teacher_id: t.id, name: t.name, source: t.pref.source || 'form',
        desired: t.d, min: t.min, max: t.max, assignedStandard: sc.k,
        standardHours: sc.k * 4, rclClasses: t.rcls.length, rclHours, totalHours: sc.k * 4 + rclHours,
        totalClassEquivalents: sc.k + 0.5 * t.rcls.length,
        campusApprovalsNeeded: sc.campusApprovalsNeeded, rclCountsTowardMax: t.rcls.length ? t.rclCounts : 'n/a',
        effectiveMaxStandard: t.effMax,
        scores: { time: round4(sc.time), course: round4(sc.course), workload: round4(sc.workload), overall: round4(sc.overall) },
        meetsTarget: t.d > 0 ? sc.overall >= ctx.settings.target - SCORE_TOL : null,
        sections: m.byT[i].map(j => ctx.S[j].id), rclSections: t.rcls.map(r => r.id),
        exceptions: excCount.get(t.id) || 0, flags, unmetPreferences: unmet
      };
    });

    const demandScores = teacherReports.filter(r => r.desired > 0).map(r => r.scores.overall);
    const wl = teacherReports.map(r => r.assignedStandard - r.desired);
    const metrics = {
      sectionsAssigned: m.covered, sectionsUnassigned: ctx.S.length - m.covered, coverage: round4(ctx.S.length ? m.covered / ctx.S.length : 1),
      teachersWithDemand: m.demand, teachersMeetingTarget: m.met,
      lowestScore: demandScores.length ? round4(Math.min(...demandScores)) : null,
      lowestScoreAmongSchedulable: round4(m.floor),
      averageScore: demandScores.length ? round4(demandScores.reduce((a, b) => a + b, 0) / demandScores.length) : null,
      negotiableExceptions: m.exceptions,
      campusCompliance: campusComplianceOf(ctx, assign),
      workloadGap: { underDesired: wl.filter(x => x < 0).length, atDesired: wl.filter(x => x === 0).length, overDesired: wl.filter(x => x > 0).length, totalAbsGap: wl.reduce((a, b) => a + Math.abs(b), 0) }
    };
    const project = ctx.project;
    const validation = validateSchedule(project, assignments.map(a => ({ section_id: a.section_id, teacher_id: a.teacher_id })), ctx.settings);
    return Object.assign({}, meta, { metrics, assignments, teacherReports, exceptions, unassigned, validation });
  }

  function emailDraft(ctx, t, s, e) {
    const first = (t.name || '').split(' ')[0] || 'colleague';
    const q = ctx.quarter || 'the upcoming quarter';
    const subject = `${q} schedule — request about ${s.name} (${DAY_NAMES[s.day]} ${fmtTime(s.start)}–${fmtTime(s.end)}, ${s.mode === 'Online' ? 'Online' : s.campus})`;
    const body = [
      `Dear ${first},`, '',
      `Thank you for submitting your ${q} scheduling preferences.`, '',
      `We would like to ask whether you could teach ${s.name} on ${DAY_NAMES[s.day]}s, ${fmtTime(s.start)}–${fmtTime(s.end)}, ${s.mode === 'Online' ? 'online' : 'at the ' + s.campus + ' campus'}, for the full 11-week quarter.`, '',
      `We are asking because this differs from your survey: ${e.affected.charAt(0).toLowerCase() + e.affected.slice(1)}.`, '',
      'Please let us know whether you can accept this assignment. If not, we will look for another option.', '',
      'Best regards,', 'Academic Administration, Approach ISC'
    ].join('\n');
    const mailto = `mailto:${(t.email || '').replace(/[^A-Za-z0-9.@_+-]/g, '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    return { subject, body, mailto };
  }

  /* ------------------------------------------------------------------ *
   * 12. Public entry point
   * ------------------------------------------------------------------ */
  /**
   * generateSchedules(project, { glpk }) → { status, blockingIssues, warnings, candidates[], comparison[] }
   * project = { quarter_id, settings, teachers, qualifications, preferences, sections, rclAssignments, locked, excludedPairs }
   */
  async function generateSchedules(project, { glpk = null, strategies, onProgress = null } = {}) {
    const ctx = buildContext(project);
    if (ctx.issues.blocking.length) return { status: 'blocked', blockingIssues: ctx.issues.blocking, warnings: ctx.issues.warnings, notScheduled: ctx.issues.notScheduled, candidates: [] };
    const want = strategies || ctx.settings.strategies;
    let mode = glpk ? 'exact' : 'heuristic';
    const candidates = [];
    let A = null;
    const order = ['A', 'B', 'C', 'A2'].filter(s => want.includes(s) || (s === 'A' && (want.includes('C') || want.includes('A2'))));
    for (const strat of order) {
      let res = null;
      if (onProgress) { try { await onProgress({ strategy: strat, label: STRATEGY_LABELS[strat], index: order.indexOf(strat), total: order.length }); } catch (e) { /* progress display only */ } }
      const opts = {};
      if (strat === 'C' || strat === 'B') opts.coverageMax = A ? metricsOf(ctx, A.assign).covered : (strat === 'C' ? ctx.S.length : null);
      opts.coverageProven = !!(A && A.stages && A.stages[0] && A.stages[0].stage === 'Coverage' && A.stages[0].proven);
      if (strat === 'C') opts.minCoverage = Math.max(0, opts.coverageMax - ctx.settings.balancedTolerance);
      if (strat === 'A2' && A) {
        const pairs = []; A.assign.forEach((i, j) => { if (i >= 0 && !ctx.lockedBySection.has(ctx.S[j].id)) pairs.push(`x_${i}_${j}`); });
        opts.noGood = pairs.length >= ctx.settings.alternativeMinChanges
          ? [{ name: 'nogood', vars: pairs.map(n => ({ name: n, coef: 1 })), bnds: { type: 3, ub: pairs.length - ctx.settings.alternativeMinChanges, lb: 0 } }] : null;
        opts.avoid = new Set(A.assign.map((i, j) => i + '|' + j));
        if (!opts.noGood && mode === 'exact') { candidates.push({ id: 'A2', label: STRATEGY_LABELS.A2, status: 'none', note: 'Too few assignments to form a distinct alternative' }); continue; }
      }
      // Known valid solutions the exact solver may fall back on if a stage hits its time limit:
      // candidate A (for B and C) and a quick heuristic schedule for this same strategy.
      opts.seeds = [];
      let hSeed = null;
      if ((strat === 'B' || strat === 'C') && A && A.vars) opts.seeds.push(A.vars);
      if (mode === 'exact') {
        const h = solveHeuristic(ctx, strat, opts); hSeed = h;
        const hv = {}; h.assign.forEach((i, j) => { if (i >= 0) hv[`x_${i}_${j}`] = 1; });
        opts.seeds.push(hv);
      }
      let candMode = mode;
      if (mode === 'exact') {
        ctx._deadline = Date.now() + ctx.settings.candidateTimeBudgetSec * 1000;
        try { res = await solveExact(ctx, glpk, strat === 'A2' ? 'A' : strat, opts); }
        catch (err) { mode = 'heuristic'; candMode = 'heuristic'; ctx.issues.warnings.push('Exact solver failed (' + err.message + '); switched to heuristic mode'); }
        if (res && res.failed === 'infeasible') res = null;
        else if (res && res.failed) { candMode = 'heuristic'; res = solveHeuristic(ctx, strat, opts); ctx.issues.warnings.push(`${strat}: exact solver ran out of time before finding any schedule; heuristic used for this candidate`); }
      }
      if (mode === 'heuristic') res = solveHeuristic(ctx, strat, opts);
      // Final guard: an exact run that hit time limits must never be reported if the heuristic schedule is better.
      if (res && hSeed && candMode === 'exact' && !res.proven) {
        const kx = keyFor(strat === 'A2' ? 'A' : strat, metricsOf(ctx, res.assign), ctx, opts), kh = keyFor(strat === 'A2' ? 'A' : strat, metricsOf(ctx, hSeed.assign), ctx, opts);
        const hOk = strat !== 'A2' || !opts.avoid || hSeed.assign.filter((i, j) => i >= 0 && !opts.avoid.has(i + '|' + j)).length >= ctx.settings.alternativeMinChanges;
        if (hOk && cmpKey(kh, kx) > 0) { res = Object.assign({}, hSeed, { stages: (res.stages || []).concat([{ stage: 'Heuristic schedule was better than the time-limited exact result; kept it', value: null, proven: false }]), proven: false }); }
      }
      if (!res) { candidates.push({ id: strat, label: STRATEGY_LABELS[strat], status: 'none', note: strat === 'A2' ? 'No alternative differing in enough assignments exists' : 'No feasible schedule' }); continue; }
      if (strat === 'A') A = res;
      if (!want.includes(strat)) continue;
      const solverLabel = candMode === 'heuristic' ? 'Heuristic; not proven optimal'
        : (res.proven ? 'Optimal for goals 1–5 in this order' : 'Best found; not proven optimal');
      const rep_ = buildReport(ctx, res.assign, { id: strat, label: STRATEGY_LABELS[strat], status: 'ok', solverMode: candMode, solverLabel, proven: res.proven, stages: res.stages });
      // Self-check: the solver's own count of teachers at the target must equal the exact recount.
      const st80 = (res.stages || []).find(x => x.stage === 'Teachers at 80%');
      if (candMode === 'exact' && st80 && st80.value != null && Math.round(st80.value) > rep_.metrics.teachersMeetingTarget)
        ctx.issues.warnings.push(`${strat}: solver counted ${st80.value} teachers at target but the exact recount is ${rep_.metrics.teachersMeetingTarget}; the recount is reported`);
      candidates.push(rep_);
    }
    const comparison = candidates.filter(c => c.status === 'ok').map(c => ({
      id: c.id, label: c.label, solver: c.solverLabel,
      assigned: c.metrics.sectionsAssigned, unassigned: c.metrics.sectionsUnassigned, coverage: c.metrics.coverage,
      teachersAt80: `${c.metrics.teachersMeetingTarget} / ${c.metrics.teachersWithDemand}`,
      lowest: c.metrics.lowestScore, lowestSchedulable: c.metrics.lowestScoreAmongSchedulable, average: c.metrics.averageScore, exceptions: c.metrics.negotiableExceptions,
      workloadAbsGap: c.metrics.workloadGap.totalAbsGap, valid: c.validation.valid
    }));
    const okC = candidates.filter(c => c.status === 'ok');
    okC.forEach((c, x) => {
      const sig = c.assignments.map(a => a.section_id + '>' + a.teacher_id).sort().join(';');
      const twin = okC.slice(0, x).find(o => o.assignments.map(a => a.section_id + '>' + a.teacher_id).sort().join(';') === sig);
      const msig = m => [m.sectionsAssigned, m.teachersMeetingTarget, m.lowestScoreAmongSchedulable, m.negotiableExceptions, m.averageScore].join('|');
      const sameMetrics = okC.slice(0, x).find(o => msig(o.metrics) === msig(c.metrics));
      if (twin) c.note = `Identical to ${twin.id}: no trade-off between goals exists in this data`;
      else if (sameMetrics && c.id !== 'A2') c.note = `Same results as ${sameMetrics.id} with different assignments: no trade-off between goals exists in this data`;
      else if (c.id === 'A2' && okC[0] && okC[0].id === 'A') {
        const aSet = new Set(okC[0].assignments.map(a => a.section_id + '>' + a.teacher_id));
        c.differsFromA = c.assignments.filter(a => !aSet.has(a.section_id + '>' + a.teacher_id)).length;
      }
    });
    comparison.forEach(row => { const c = okC.find(x => x.id === row.id); row.note = c.note || (c.differsFromA != null ? `${c.differsFromA} assignments differ from A` : ''); });

  }

  /** Check a manual change before applying it: returns the hard-rule conflicts it would introduce. */
  function previewManualChange(project, assignments, change /* {section_id, teacher_id|null} */) {
    const next = assignments.filter(a => a.section_id !== change.section_id);
    if (change.teacher_id) next.push({ section_id: change.section_id, teacher_id: change.teacher_id });
    const v = validateSchedule(project, next);
    const before = new Set(validateSchedule(project, assignments).errors);
    return { assignments: next, newConflicts: v.errors.filter(e => !before.has(e)), validation: v };
  }

  /** Re-score any set of assignments (e.g. after manual edits) with the same formula. */
  function scoreAssignments(project, assignments) {
    const ctx = buildContext(project);
    const assign = new Array(ctx.S.length).fill(-1);
    assignments.forEach(a => { const j = ctx.secIndex.get(a.section_id), i = ctx.tIndex.get(a.teacher_id); if (j != null && i != null) assign[j] = i; });
    return buildReport(ctx, assign, { id: 'manual', label: 'Manually edited', status: 'ok', solverMode: 'n/a', solverLabel: 'Manual edit (re-scored)', proven: false, stages: [] });
  }

  function assignmentsToCSV(candidate) {
    const esc = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ['schedule_candidate', 'section_id', 'teacher_id', 'locked', 'source', 'reason'];
    return [head.join(',')].concat(candidate.assignments.map(a => [candidate.id, a.section_id, a.teacher_id, a.locked, a.source, a.reason].map(esc).join(','))).join('\n');
  }

  return {
    DEFAULT_SETTINGS, VALID_SLOTS, DAYS, BLOCKS,
    parseCSV, parseCourseCSV, buildContext, generateSchedules, validateSchedule,
    previewManualChange, scoreAssignments, checkFinalization, scoreTeacher, workloadScore, assignmentsToCSV, fmtTime, pct
  };
});

function csvObjects(text) {

/* ---------------- Teachers ---------------- */
function parseTeacherCSV(text) {
  const { header, records } = csvObjects(text);
  const lower = header.map(h => h.toLowerCase());
  const missing = ['full_name', 'school_email'].filter(c => !lower.includes(c));
  if (!header.length) return { fileErrors: ['The file is empty.'], rows: [] };
  if (missing.length) return { fileErrors: ['Missing required column(s): ' + missing.join(', ') + '. Use Teacher_Import_Template.csv.'], rows: [] };
  const get = (r, c) => { const h = header[lower.indexOf(c)]; return h == null ? '' : r[h]; };
  const seenEmail = new Map();
  const rows = records.map(r => {
    const rec = {
      full_name: get(r, 'full_name'), school_email: get(r, 'school_email').toLowerCase(),
      status: (get(r, 'status') || 'active').toLowerCase(), admin_notes: get(r, 'admin_notes')

    const errors = [], warnings = [];
    if (!rec.full_name) errors.push('Missing full_name');
    if (!rec.school_email) errors.push('Missing school_email');
    else if (!EMAIL_RE.test(rec.school_email)) errors.push('school_email is not a valid address');
    if (!['active', 'inactive'].includes(rec.status)) errors.push('status must be active or inactive');

    const existing = state.teachers.find(t => t.school_email === rec.school_email);
    const action = existing ? 'update' : 'new';
    return { line: r._line, rec, errors, warnings, action };
  });

}
function commitTeachers(rows) {
  let n = 0;
  rows.filter(r => !r.errors.length).forEach(r => {
    const ex = state.teachers.find(t => t.school_email === r.rec.school_email);
    if (ex) Object.assign(ex, r.rec); else state.teachers.push(Object.assign({ teacher_id: nextTeacherId() }, r.rec));

function normProgram(v) {
