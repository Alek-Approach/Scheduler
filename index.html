function mapFormHeader(header) {
  const map = { timestamp: null, email: null, codes: {}, grids: {} };
  header.forEach((h, i) => {
    const t = String(h).trim();
    if (map.timestamp == null && /^timestamp$/i.test(t)) { map.timestamp = i; return; }
    if (!/^\d\.\d/.test(t)) {
      // Google Forms labels the sign-in column "Email Address", "Email address" or, for organization sign-in, "Username"
      const rank = /^e-?mail\s*address$/i.test(t) ? 1 : /^user\s*name$/i.test(t) ? 2 : /e-?mail/i.test(t) ? 3 : 0;
      if (rank && (map.email == null || rank < map.emailRank)) { map.email = i; map.emailRank = rank; return; }
      if (rank) return;
    }
    const m = /^\s*(\d\.\d)\b.*?(?:\[([^\]]+)\])?\s*$/.exec(t);

// Google Sheets exports timestamps like "11/14/2026 10:23:45" (US) or "14/11/2026 10:23:45"; ISO also accepted.
function parseFormTimestamp(raw) {

  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(s);
  if (m) {

    if (mo > 12 && d <= 12) { const x = mo; mo = d; d = x; }
    return new Date(+m[3], mo - 1, d, +m[4], +m[5], +(m[6] || 0)).getTime();
  }

  return isNaN(t) ? 0 : t;
}

      full_name_submitted: val('1.1'), preferred_campus: campus || 'no_preference', other_campus: other == null ? null : other,

      p.courseMappings.forEach(m => {
        const prev = (old.courseMappings || []).find(x => x.source_question === m.source_question && x.source_text === m.source_text && x.status !== 'unmatched');
        if (prev) Object.assign(m, { course_id: prev.course_id, status: prev.status, matched_by: prev.matched_by, matched_on: prev.matched_on });
      });
    }
    state.preferences = state.preferences.filter(x => x.teacher_id !== r.teacher_id);
    state.preferences.push(p);
    n++;
  });
  rows.forEach(r => {
    const id = r.pref.response_id;
    if (!state.rawResponses.find(x => x.response_id === id)) state.rawResponses.push({ response_id: id, email: r.email, teacher_id: r.teacher_id, timestamp: r.timestamp, used: !!r.use, imported_at: nowStamp(), errors: r.errors, raw: r.raw });
    else state.rawResponses.forEach(x => { if (x.response_id === id) x.used = !!r.use; });
  });
  save(`Imported ${plural(n, 'teacher preference')} from Google Forms (${rows.length} rows)`);
  return n;
}

/* ---------------- RCL ---------------- */
function rclIssues() {
  const blocking = [], warnings = [], perSection = {};
  const note = (sid, msg, bad) => { (perSection[sid] = perSection[sid] || []).push({ msg, bad }); };
  const byT = new Map();
  state.rclAssignments.forEach(r => { const s = sectionById(r.section_id); if (!s) return; if (!byT.has(r.teacher_id)) byT.set(r.teacher_id, []); byT.get(r.teacher_id).push(s); });
  byT.forEach((list, tid) => {
    const cfg = state.teacherConfig.find(c => c.teacher_id === tid);
    if (!cfg || (cfg.rcl_counts_toward_max !== true && cfg.rcl_counts_toward_max !== false)) blocking.push(`${teacherName(tid)}: choose whether RCL counts toward the maximum`);
    for (let a = 0; a < list.length; a++) for (let b = a + 1; b < list.length; b++) {
      const x = list[a], y = list[b];
      if (x.day === y.day && x.start < y.end && y.start < x.end) { blocking.push(`${teacherName(tid)}: ${x.id} and ${y.id} overlap`); note(x.id, `Overlaps ${y.id} for the same teacher`, true); note(y.id, `Overlaps ${x.id} for the same teacher`, true); }
    }
    const p = prefOf(tid);
    list.forEach(s => {
      if (p && p.availability && p.availability[s.slot] === 'unavailable') note(s.id, `${teacherName(tid)} marked this block Unavailable (your decision)`, false);
      if (!p) note(s.id, `${teacherName(tid)} has no preferences this quarter`, false);
    });
  });
  return { blocking, warnings, perSection, byT };
}

  const secs = rclSections();
  const ri = rclIssues();
  const teachersWithRcl = [...ri.byT.keys()];
  return head('RCL classes', 'RCL classes (2 hours) are assigned by hand. The scheduler never assigns or moves them, keeps standard classes from overlapping them, and includes them in campus travel checks.') + `

  <section class="panel"><div class="panel-head"><h2>RCL sections</h2><span class="muted small">${secs.length} from the course CSV</span></div>
  <div class="panel-body flush"><div class="table-wrap">
  ${secs.length ? `<table><thead><tr><th>Section</th><th>When</th><th>Where</th><th>Teacher</th><th>Recorded</th><th>Checks</th></tr></thead><tbody>

      return `<tr><td>${esc(s.name)}<span class="sub">${esc(s.id)} · ${esc(s.levels.join(' + ') || s.program)}</span></td><td>${esc(sectionWhen(s))}</td><td>${esc(sectionWhere(s))}</td>

      <td class="small">${ra ? `${esc(ra.entered_by || '')}<span class="sub">${esc(ra.entered_on || '')}</span>` : '—'}</td>
      <td>${notes.map(n => `<span class="badge ${n.bad ? 'bad' : 'warn'}">${esc(n.msg)}</span>`).join(' ') || (ra ? '<span class="badge ok">OK</span>' : '')}</td></tr>`; }).join('')}

  </div></div></section>
  <section class="panel"><div class="panel-head"><h2>RCL workload decisions</h2><span class="muted small">Decide for each teacher; affects only how many standard classes they can receive, never their satisfaction score.</span></div>

    ${teachersWithRcl.map(tid => { const n = ri.byT.get(tid).length; const cfg = state.teacherConfig.find(c => c.teacher_id === tid) || {}; const p = prefOf(tid); const max = p ? p.max_classes : null;
      const v = cfg.rcl_counts_toward_max; const allowed = max == null ? '—' : v === true ? Math.max(0, Math.floor(max - 0.5 * n + 1e-9)) : v === false ? max : '—';
      return `<tr><td>${esc(teacherName(tid))}<span class="sub">${esc(teacherEmail(tid))}</span></td><td>${n} (${n * 2} h)</td><td class="num">${max == null ? '—' : max}</td>

      <td class="num">${allowed}</td><td class="small">${esc(cfg.set_by || '')}<span class="sub">${esc(cfg.set_on || '')}</span></td></tr>`; }).join('')}

function genResults(res) {

    <td><button class="btn small primary" data-act="save-candidate" data-id="${esc(c.id)}">Save as draft</button></td></tr>`).join('')}
  </tbody></table></div></div>
  ${res.warnings && res.warnings.length ? `<div class="panel-body"><div class="notice warn" style="margin:0"><b>Notes from the scheduler:</b>${issuesList(res.warnings)}</div></div>` : ''}
  <div class="panel-body"><details><summary>How each alternative was solved</summary>${ok.map(c => `<p style="margin-top:8px"><b>${esc(c.label)}</b></p><ul>${(c.stages || []).map(s => `<li>${esc(s.stage)}: ${s.value == null ? '—' : esc(s.value)} ${s.proven ? '<span class="badge ok">proven</span>' : '<span class="badge warn">not proven</span>'} ${s.note ? `<span class="muted small">${esc(s.note)}</span>` : ''}</li>`).join('')}</ul>`).join('')}</details></div>
  </section>`;
}
async function runGenerate() {
  const strategies = ['A'].concat(['B', 'C', 'A2'].filter(k => ui.genOpts && ui.genOpts[k]));
  ui.gen = { running: true, started: Date.now(), progress: null, result: null, error: null };
  render();
  const timer = setInterval(() => { const el = document.getElementById('gen-elapsed'); if (el && ui.gen) el.textContent = Math.round((Date.now() - ui.gen.started) / 1000); }, 1000);
  try {
    const res = await ENG.generateSchedules(projectFor(null), {
      glpk: window.__glpkStatus === 'ready' ? window.__glpk : null, strategies,
      onProgress: async p => { ui.gen.progress = p; if (ui.page === 'generate') render(); await new Promise(r => setTimeout(r, 30)); }
    });
    ui.gen.result = res; ui.gen.ms = Date.now() - ui.gen.started; ui.gen.finishedAt = nowStamp();
    audit(`Generated ${res.candidates ? res.candidates.length : 0} alternative(s) (${res.mode || 'blocked'})`);
  } catch (e) { console.error(e); ui.gen.error = 'Generation failed: ' + e.message; }
  finally { clearInterval(timer); ui.gen.running = false; render(); }
}

function calendarTab(sch, rep) {

  const pass = s => (!f.where || (f.where === 'Online' ? s.mode === 'Online' : s.campus === f.where)) && (!f.program || s.program === f.program) && (!f.level || s.levels.includes(f.level));

/* ---------------- render ---------------- */
function render() {
  const ae = document.activeElement;
  const focusId = ae && ae.id, selStart = ae && ae.selectionStart, selEnd = ae && ae.selectionEnd;
  const scrollY = window.scrollY;
  document.getElementById('app').innerHTML = shellHTML();
  renderModal();
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text field */ } } }
  window.scrollTo(0, scrollY);
}
function renderModal() {
  let root = document.getElementById('modal-root');
  if (!root) { root = document.createElement('div'); root.id = 'modal-root'; document.body.appendChild(root); }
  let html = '';
  if (ui.modal) {
    const m = MODALS[ui.modal.type](ui.modal);
    html += `<div class="overlay" data-overlay="modal"><div class="modal ${m.narrow ? 'narrow' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><h2 id="modal-title">${m.title}</h2><button class="btn ghost x" data-act="modal-close" aria-label="Close">Close</button></div>
      <div class="modal-body">${m.body}</div>${m.foot ? `<div class="modal-foot">${m.foot}</div>` : ''}</div></div>`;
  }
  if (ui.confirm) {
    const c = ui.confirm;
    html += `<div class="overlay" style="z-index:55"><div class="modal narrow" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal-head"><h2 id="confirm-title">${esc(c.title)}</h2></div><div class="modal-body"><p>${c.body}</p></div>
      <div class="modal-foot"><button class="btn" data-act="confirm-no">${esc(c.cancel || 'Cancel')}</button><button class="btn ${c.danger ? 'danger' : 'primary'}" data-act="confirm-yes" id="confirm-yes">${esc(c.ok)}</button></div></div></div>`;
  }
  const had = root.innerHTML !== '';
  root.innerHTML = html;
  if (html && !had) { const f = root.querySelector('#confirm-yes') || root.querySelector('.modal-body input, .modal-body select, .modal-body textarea, .modal-body button') || root.querySelector('button'); if (f) f.focus(); }
}
function openModal(type, data) { ui.modal = Object.assign({ type }, data || {}); renderModal(); }
function closeModal() { ui.modal = null; renderModal(); }
function confirmBox(title, body, ok, danger, cancel) {
  return new Promise(resolve => { ui.confirm = { title, body, ok, danger, cancel, resolve }; renderModal(); });
}

    const conflicts = pv.newConflicts.map(c => nameIds(c.replace(/^[^:]+:\s*/, '')));
    let after = null, kAfter = null, approval = false, otherExc = false;
    if (!conflicts.length) {
      const r2 = ENG.scoreAssignments(proj, pv.assignments);

async function setExceptionStatus(key, status) {
  const sch = activeSchedule(); const rep = reportFor(sch);

    const yes = await confirmBox('Teacher declined', `Remove ${esc(teacherName(e.teacher_id))} from ${esc(e.section_id)} and stop the scheduler from proposing this pairing again? Their quarterly preferences stay unchanged.`, 'Remove assignment', true, 'Only record the answer');

    const lock = await confirmBox('Teacher accepted', `Lock ${esc(e.section_id)} with ${esc(teacherName(e.teacher_id))} so regeneration keeps it?`, 'Lock it', false, 'Not now');
    if (lock) sch.locked = sch.locked.filter(l => l.section_id !== e.section_id).concat([{ section_id: e.section_id, teacher_id: e.teacher_id }]);
  }
  if (status === 'resolved' && e.exception_class === 'unresolved_assignment' && !st.resolution) st.resolution = 'left_unassigned';
  if (status === 'resolved' && e.exception_class === 'negotiable_preference' && !st.resolution) st.resolution = 'assignment_confirmed';
  st.history = (st.history || []).concat([{ at: nowStamp(), by: currentUser() || 'admin', from, to: status }]);
  st.status = status; sch.exceptionStates[key] = st;

}

      let data; try { data = JSON.parse(text); } catch (e) { toast('That file is not a valid backup (not JSON).', true); return; }
      if (!data || !Array.isArray(data.teachers) || !Array.isArray(data.sections) || !Array.isArray(data.schedules)) { toast('That file is not an Approach scheduling backup.', true); return; }
      if (!(await confirmBox('Restore this backup?', `Everything in this browser is replaced with the backup from ${esc(fmtDate(data.exportedAt || data.savedAt))} (${data.teachers.length} teachers, ${data.schedules.length} schedules).`, 'Restore backup', true))) return;
      const s = emptyState(); delete data.backupOf; delete data.exportedAt;
      state = migrateState(Object.assign(s, data, { settings: Object.assign(defaultSettings(), data.settings || {}) }));
      ui.gen = null; ui.preview = {}; ui.undo = {}; save('Restored from backup'); toast('Backup restored.');
    }
  } catch (e) { toast('Could not read the file: ' + e.message, true); }
  el.value = '';
  render();
}

/* ---------------- wiring ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el, e); return; }
  if (e.target.matches('[data-overlay="modal"]') && !ui.confirm) closeModal();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.file) { onFile(el); return; }
  if (el.dataset.change && CHG[el.dataset.change]) { CHG[el.dataset.change](el); return; }
  if (ui.modal && ui.modal.draft) {
    if (el.dataset.mfield) { ui.modal.draft[el.dataset.mfield] = el.dataset.num ? (el.value === '' ? '' : +el.value) : (el.value === '' && el.tagName === 'SELECT' ? null : el.value); if (el.tagName === 'SELECT') renderModal(); }
    if (el.dataset.mcheck) { const arr = ui.modal.draft[el.dataset.mcheck] = ui.modal.draft[el.dataset.mcheck] || []; const i = arr.indexOf(el.value); if (el.checked && i < 0) arr.push(el.value); if (!el.checked && i >= 0) arr.splice(i, 1); }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.search) { ui.search[el.dataset.search] = el.value; render(); return; }
  if (ui.modal && ui.modal.draft && el.dataset.mfield && el.tagName !== 'SELECT') ui.modal.draft[el.dataset.mfield] = el.dataset.num ? (el.value === '' ? '' : +el.value) : el.value;
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (ui.confirm) { ACT['confirm-no'](); return; }
  if (ui.modal) closeModal();
});
window.addEventListener('glpk-status', () => render());
window.addEventListener('beforeprint', () => { if (!document.getElementById('print-root').innerHTML) document.getElementById('print-root').innerHTML = '<p>Use the print buttons on Finalize &amp; export for formatted schedules.</p>'; });
window.addEventListener('afterprint', () => { const r = document.getElementById('print-root'); if (r) r.innerHTML = ''; });

/* expose a small API for automated checks */
window.ApproachApp = { get state() { return state; }, ui, render, ACT, CHG, parseFormsCSV, parseTeacherCSV, parseQualCSV, reportFor, activeSchedule, scheduleRows, TEMPLATES };
render();

})();
